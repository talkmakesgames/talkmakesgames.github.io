<script>
// ═══ 畫面縮放：540×960 等比放大，置中 ═══

// ═══ 存檔（先存在手機裡；之後做帳號登入時搬到帳號） ═══
const KEY = /zero-test/.test(location.pathname) ? 'zw-save-test' : 'zw-save-v1';
// 2026-11-26 快節奏版（給使用者比較）：網址加 ?quick=1 → 開場用 59 秒精簡版（原版 70 秒）；解說A 精簡版評審覺得看不懂，不用；?quick=0 換回原版
const QMODE = (() => { try { const m = location.search.match(/[?&]quick=([012])/); if (m) localStorage.setItem('zw-quick', m[1]); return localStorage.getItem('zw-quick') || '0'; } catch (e) { return '0'; } })();
const QUICK = QMODE === '1' || QMODE === '2', QUICK2 = QMODE === '2';   // ?quick=2：開場精簡版＋解說A 改成可以點的劇情對話   // 測試網址用另一份存檔，不影響正式版

const VEHN = ['廢鐵三輪貨車', '改裝邊車機車', '鐵網皮卡', '越野房車', '裝甲房車', '青晶房車', '履帶堡壘', '末日堡壘', '方舟'];

// ═══ 帳號（Google 登入，只用來備份存檔；不存、不顯示 Email） ═══

function renderAcct() {

}
window.onCloudUser = u => { renderAcct(); if ($('scr-home').classList.contains('on')) renderQuestDot(); let p = null; try { p = sessionStorage.getItem('zw-login'); } catch (e) {} if (u && p) cloudLogin(p === 'n', true); };   // 手機瀏覽器擋彈出視窗、改用整頁跳轉登入時，回來接著做
save();
const day = () => Math.floor((NOW() - S.firstDay) / 86400000) + 1;

// ═══ 第一次開遊戲的流程：開場影片 → 試玩 → 解說 A → 取名 → 解說 B → 首頁（只跑一次） ═══
const params = new URLSearchParams(location.search);
if (params.get('from') === 'trial' && S.intro === 'trial') { S.intro = 'explainA'; save(); history.replaceState(null, '', location.pathname); }
let vidNext = null, vidReplay = false;
function playVideo(src, next, opts) {
  vidNext = next; vidReplay = !!(opts && opts.replay);
  const v = $('vid'); v.src = src; v.currentTime = 0; $('tapStart').style.display = 'flex'; $('vidSub').style.opacity = 0;
  show('video');

}

$('vid').onended = endVideo; $('skip').onclick = endVideo;

function runIntro() {
  if (S.intro === 'opening') playVideo(QUICK ? 'video/opening_short.mp4' : 'video/opening.mp4', () => { S.intro = 'trial'; save(); location.href = 'battle/?trial=1'; });

  else if (S.intro === 'explainA') playVideo('video/explainA.mp4', () => { S.intro = 'naming'; save(); startNaming(); });
  else if (S.intro === 'naming') startNaming();
  else if (S.intro === 'explainB' && QUICK2 && window.Story && window.STORY_INTRO) Story.play('introB', { data: window.STORY_INTRO, name: S.hero, base: '', onDone: finishIntro });   // ?quick=2：互動版
  else if (S.intro === 'explainB') playVideo('video/explainB.mp4', finishIntro, { sub: `零：「${S.hero}。」` });
  else goHome();
}
function finishIntro() {
  S.intro = 'done'; S.lastSeen = NOW();
  // 試玩是零的「未來模擬」，模擬裡的敵人資料先記成「看過」（名字＋剪影），真的打倒才解鎖完整資料
  ['zombie', 'dasher', 'heavy', 'mech'].forEach(k => S.codex.seen[k] = 1);
  addDiary('加班加到穿越。主管還在問報告。');
  save(); bikeIntro();
}

function bikeIntro() {   // 2026-11-26 第一章 v2：撿來的破腳踏車 → 第一次合成（拼圖）→ 三輪車
  const done = () => { S.flags = S.flags || {}; S.flags.trike = 1; S.story = S.story || {}; S.story.c1bike = 1; S.story.c1bike2 = 1;
    addDiary(`撿到一台壞掉的腳踏車，用手把它合成成三輪車。零說時速跟我的工作效率差不多。它叫我「${S.hero}」的時候，語氣很像在念錯誤代碼。`); save(); goHome(true); };
  if (!window.Story || !window.STORY_C1 || !window.Puzzle) { done(); return; }
  show('home'); renderTop();
  Story.play('c1bike', { name: S.hero, base: '', onDone: () => Puzzle.open({ img: 'img/v1.webp', size: 3, title: '合成：三輪車', noCancel: true,
    onDone: () => Story.play('c1bike2', { name: S.hero, base: '', onDone: done }) }) });
}
// ═══ 取名 ═══
let nameStep = 0;
function startNaming() {
  show('naming'); nameStep = 0; $('zeroLine').style.display = 'none';
  $('nameAsk').innerHTML = '你叫什麼名字？'; $('nameIn').value = ''; $('nameIn').placeholder = '社畜';
  $('loginOld').style.display = 'none';   // 2026-11-27 拿掉帳號
}
$('nameOk').onclick = () => {
  const v = $('nameIn').value.trim();
  if (nameStep === 0) {
    S.hero = v || '社畜'; nameStep = 1; save();
    $('zeroLine').style.display = 'block';
    $('zeroLine').textContent = `零：「${S.hero}……記下了。我是型號 ZR-0。要叫我什麼隨便你，反正你取的名字一定很難聽。」`;
    $('nameAsk').innerHTML = '幫 AI 取名字<br><span style="font-size:14px;color:#8fa0ae">不改就叫「零」</span>'; $('nameIn').value = ''; $('nameIn').placeholder = '零';
    $('loginOld').style.display = 'none';
  } else {
    S.ai = v || '零'; S.intro = 'explainB'; save(); runIntro();
  }
};
$('loginOld').onclick = () => cloudLogin(true);

// ═══ 首頁 ═══
const VEH = ['廢鐵三輪貨車', '改裝邊車機車', '鐵網皮卡', '越野房車', '裝甲房車', '青晶房車', '履帶堡壘', '末日堡壘', '方舟'];
const VEH_SLOTS = [1, 2, 3, 3, 4, 4, 5, 6, 6];
const FUEL_MAX = () => 100 + Math.max(0, (S.dev.oil || 0) - 1) * 50;   // 油箱上限＝石油收集器等級
const ZERO_LINES = () => [
  `${S.hero}，油箱還有 ${S.res.fuel}。夠你出去被打一頓了。`,
  '這台三輪車的時速，大概跟你的工作效率差不多。',
  '主管又傳訊息了。我幫你已讀了，不用謝。',
  '我分析過了：你活下去的機率比昨天高 0.3%。恭喜。',
  '倉庫的廢鐵堆得像你的待辦清單。',
  `第 ${day()} 天。你的手速總算比樹懶快一點。`,
];
function renderTop() {
  const r = S.res, items = [['coin', fmt(r.coin)], ['scrap', fmt(r.scrap)], ['chip', fmt(r.chip)], ['fuel', `${r.fuel}/${FUEL_MAX()}`], ['power', `${Math.floor(r.power || 0)}`], ['core', fmt(r.core)]];
  $('topbar').innerHTML = items.map(([k, v]) => `<div class="res" data-r="${k}">${k === 'power' ? '<span class="pwi">⚡</span>' : `<img src="img/r_${k}.webp" alt="">`}${v}</div>`).join('');
  $('who').innerHTML = `${S.hero}　＆　${S.ai}<small>第 ${day()} 天｜零號廢域</small>`;
  $('vehicle').src = `img/v${S.tier}.webp`; 
  $('vehName').innerHTML = `${VEH[S.tier - 1]} <small>Lv.${S.tier}${S.sub ? ' +' + S.sub : ''}</small>`;
  $('goCost').textContent = S.dev.oil ? '汽油 -10（頭目 -20）' : '🚲 踩腳踏車，不花汽油';
}
// ═══ 設備＝機器人：一開始什麼都不會自動來；合成機器人以後才自動採集。所有設備都耗電，沒電就停工 ═══
const DEV = [   // [代號, 名字, 說明, 圖（之後換成機器人的圖）, 最高等級, 開放條件（劇情）, 開放說明]
  ['food', '食物機器人', '從空氣裡的水分和一些不明材料做出食物。味道不保證。', 'img/dev_food.webp', 1, () => S.story && S.story.c1base1, '打完 1-1 回到車旁開放'],
  ['scrap', '廢鐵採集機器人', '自動去附近撿廢鐵。碎片：1-1、1-3、1-5 掉落', 'img/dev_scrap.webp', 5, () => S.dev.food, '合成食物機器人後開放'],
  ['oil', '石油收集器', '裝在三輪車上，自動收集汽油。裝上以後車子有引擎，出發要花汽油。碎片：1-2、1-6 掉落', 'img/dev_oil.webp', 5, () => S.story && S.story.c1s1d, '找到加油站後開放（1-2）'],
  ['power', '電能機器人', '發電。有了它就不用一直靠腳踩。碎片：1-4 掉落', 'img/dev_power.webp', 5, () => S.story && S.story.c1s4b, '救了老周後開放（1-4）'],
];
const PZ_SIZE = [0, 3, 4, 4, 5, 6];   // 合成＝3×3，升級越高拼圖越大
const devUse = () => (S.dev.scrap ? 2 + S.dev.scrap : 0) + (S.dev.oil ? 2 + S.dev.oil : 0);   // 每小時耗電
const devGen = () => S.dev.power ? 4 + 4 * S.dev.power : 0;   // 每小時發電
const POWER_MAX = () => 100 + 50 * (S.dev.power || 0);
const DEV_OUT = { scrap: l => 40 * l, oil: l => 4 + 2 * l };   // 每小時產出
const devCost = lv => ({ coin: Math.round(150 * Math.pow(lv, 1.7)), scrap: 60 * lv, chip: 8 * (lv - 1) });
const fragNeed = (lv, k) => k === 'food' ? 0 : PZ_SIZE[lv] * PZ_SIZE[lv];   // 特殊材料＝拼圖碎片：碎片數＝拼圖格數（食物機器人零免費送）
const fragHave = k => (S.frag && S.frag[k]) || 0;
const devTier = lv => Math.max(1, lv - 1);   // 升級要載具等級夠高
const devSum = () => Object.values(S.dev).reduce((a, b) => a + b, 0);
function runDevices() {   // 從上次算到現在：耗電、發電、產出
  const t = NOW(), h = Math.max(0, (t - (S.devTs || t)) / 3600000); S.devTs = t;
  if (!h) return null;
  const use = devUse(), gen = devGen(); let run = h;
  if (use > gen) { run = Math.min(h, S.res.power / (use - gen)); S.res.power = Math.max(0, S.res.power - (use - gen) * run); }
  else if (S.res.power < POWER_MAX()) S.res.power = Math.min(POWER_MAX(), S.res.power + (gen - use) * h);
  const eff = run + (use > gen && use ? (h - run) * gen / use : 0);   // 沒電以後，只剩發電的那一點點能用
  S.devAcc = S.devAcc || { scrap: 0, fuel: 0 }; const g = { scrap: 0, fuel: 0 };
  if (S.dev.scrap) S.devAcc.scrap += DEV_OUT.scrap(S.dev.scrap) * eff;
  if (S.dev.oil) S.devAcc.fuel += DEV_OUT.oil(S.dev.oil) * eff;
  g.scrap = Math.floor(S.devAcc.scrap); S.devAcc.scrap -= g.scrap; g.fuel = Math.floor(S.devAcc.fuel); S.devAcc.fuel -= g.fuel;
  const s0 = S.res.scrap, f0 = S.res.fuel;
  S.res.scrap = Math.max(s0, Math.min(resCap('scrap'), s0 + g.scrap)); S.res.fuel = Math.max(f0, Math.min(FUEL_MAX(), f0 + g.fuel));
  g.scrap = S.res.scrap - s0; g.fuel = S.res.fuel - f0;
  return { h, g, stopped: use > gen && run < h };
}
function tickResources() { runDevices(); }
function idleReport(r) {   // 回來時：機器人做了什麼（沒有機器人就什麼都沒有）
  if (!r || r.h * 60 < 10 || !(r.g.scrap || r.g.fuel || r.stopped)) return;
  const mins = r.h * 60, hh = Math.floor(mins / 60), m = Math.round(mins % 60);
  $('repText').innerHTML = `你不在的 ${hh ? hh + ' 小時 ' : ''}${m} 分鐘，<br>機器人做了這些。` + (r.stopped ? '<br><span style="color:#ff9a9a">⚡ 中途沒電，機器人停工了。<br>出去踩踩踏板就會發電。</span>' : '');
  $('repGain').innerHTML = (r.g.scrap ? `<span><img src="img/r_scrap.webp" alt="">+${fmt(r.g.scrap)}</span>` : '') + (r.g.fuel ? `<span><img src="img/r_fuel.webp" alt="">+${fmt(r.g.fuel)}</span>` : '');
  $('report').style.display = 'block';
  $('repOk').onclick = () => { $('report').style.display = 'none'; };
}

<script>
(function () {
  var KEY = 'zw-a2hs-hide', bar = document.getElementById('tmgA2hs'), help = document.getElementById('tmgA2hsHelp');
  var ua = navigator.userAgent || '', deferred = null;
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function track(n, p) { try { window.tmgTrack && window.tmgTrack(n, p); } catch (e) {} }
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var android = /Android/.test(ua);
  var inApp = /Instagram|FBAN|FBAV|FB_IAB|Line\/|TikTok|musical_ly|Bytedance|BytedanceWebview|Threads|Barcelona|MicroMessenger|YouTube|; wv\)/i.test(ua);

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('/sw.js').catch(function () {});
  }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; if (!kind) kind = 'android'; maybeShow(); });

  function maybeShow() {
    if (standalone || !kind || store(KEY)) return;
    if (window.ZW_A2HS_OK && !window.ZW_A2HS_OK()) { setTimeout(maybeShow, 4000); return; }   // 開場、劇情中不打擾

  }
  function showHelp(html, arrow) {

  bar.querySelector('.x').onclick = function () { bar.classList.remove('show'); store(KEY, 'no'); track('a2hs_dismiss', { kind: kind }); };

        { t: '↗', pos: 'top:10px;right:18px' });
    } else if (kind === 'ios') {
      showHelp('<h3>加到主畫面只要 2 步 📲</h3><ol><li>點下方的「分享」按鈕 <span class="ic">⬆︎</span>（方框加向上箭頭）</li><li>往下滑，點「<b>加入主畫面</b>」</li></ol><p style="font-size:14px;opacity:.7;margin:12px 0 0">之後在桌面點「廢域方舟」就能直接玩</p>',
        { t: '⬇', pos: 'bottom:8px;left:50%;margin-left:-14px', mid: true });
    } else {
      showHelp('<h3>加到主畫面只要 2 步 📲</h3><ol><li>點右上角的 <span class="ic">⋮</span></li><li>點「<b>加到主畫面</b>」或「<b>安裝應用程式</b>」</li></ol>',
        { t: '↗', pos: 'top:10px;right:18px' });
    }
  };
  // 設定裡的「手動加到主畫面」按鈕（不管提示條有沒有被關掉都能用）
  window.zwA2hsManual = function () {
    track('a2hs_manual', { kind: kind, standalone: standalone });

      showHelp('<h3>你現在是從主畫面的捷徑打開的</h3><ol><li>用手機的瀏覽器（Chrome 或 Safari）打開<br><b>talkmakesgames.github.io/zero-test/</b></li><li>在那裡再按一次「📲 加到主畫面」</li></ol><p style="font-size:14px;opacity:.7;margin:12px 0 0">如果主畫面已經有「廢域方舟」，就不用再加了</p>');
      return;
    }
    if (!kind) kind = 'android';
    bar.querySelector('.go').onclick();
  };

})();

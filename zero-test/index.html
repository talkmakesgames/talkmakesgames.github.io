<script>
// ═══ 畫面縮放：540×960 等比放大，置中 ═══
const stage = document.getElementById('stage');
function fit() { const s = Math.min(innerWidth / 540, innerHeight / 960); stage.style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();
const $ = id => document.getElementById(id);
// 2026-11-28 跳出訊息排隊：同時來好幾則時一則一則顯示，不會互相蓋掉；同一句不重複
function toast(t, ms) { const e = $('toast'); toast.q = toast.q || [];
  if (e.classList.contains('show') && toast.cur && toast.cur !== t) { if (!toast.q.some(x => x[0] === t) && toast.q.length < 4) toast.q.push([t, ms]); return; }
  toast.cur = t; e.textContent = t; e.classList.add('show'); clearTimeout(toast.t);
  toast.t = setTimeout(() => { e.classList.remove('show'); toast.cur = null; const n = toast.q.shift(); if (n) setTimeout(() => toast(n[0], n[1]), 250); }, ms || 1800); }
function show(id) { document.querySelectorAll('.scr').forEach(s => s.classList.toggle('on', s.id === 'scr-' + id)); }

// ═══ 存檔（先存在手機裡；之後做帳號登入時搬到帳號） ═══
const KEY = /zero-test/.test(location.pathname) ? 'zw-save-test' : 'zw-save-v1';
// 2026-11-26 快節奏版（給使用者比較）：網址加 ?quick=1 → 開場用 59 秒精簡版（原版 70 秒）；解說A 精簡版評審覺得看不懂，不用；?quick=0 換回原版
const QMODE = (() => { try { const m = location.search.match(/[?&]quick=([012])/); if (m) localStorage.setItem('zw-quick', m[1]); return localStorage.getItem('zw-quick') || '0'; } catch (e) { return '0'; } })();
const QUICK = QMODE === '1' || QMODE === '2', QUICK2 = QMODE === '2';   // ?quick=2：開場精簡版＋解說A 改成可以點的劇情對話   // 測試網址用另一份存檔，不影響正式版
const NOW = () => Date.now();
function newSave() {
  return { v: 1, intro: 'opening', hero: '', ai: '零', firstDay: NOW(), lastSeen: NOW(), fuelTs: NOW(),
    res: { coin: 0, scrap: 0, chip: 0, fuel: 0, core: 0, blueprint: 0, power: 0 }, tier: 1, sub: 0, dev: { food: 0, scrap: 0, oil: 0, power: 0 }, devTs: NOW(), pedalSeen: 0,
    fac: { tank: 1, store: 1, recycle: 1, battery: 1, workshop: 1, dock: 1 }, c0v: 7,
    codex: { seen: {}, kills: {} }, diary: [], stats: { maxCombo: 0, maxHit: 0, clears: 0 }, cleared: {} };
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!S || S.v !== 1) S = newSave();
ZW_GEAR.ensure(S);   // 隊伍等級＋裝備（舊存檔自動補上）
S.dev = Object.assign({ food: 0, scrap: 0, oil: 0, power: 0 }, S.dev || {}); if (S.res.power == null) S.res.power = 60; if (!S.devTs) S.devTs = NOW(); if (S.pedalSeen == null) S.pedalSeen = (S.stats && S.stats.clears) || 0;   // 2026-11-26 設備＝機器人（舊存檔補上）
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} if (window.Cloud && Cloud.user && S.intro === 'done') { clearTimeout(save.t); save.t = setTimeout(() => Cloud.push(S).catch(() => {}), 3000); } }
// ═══ 選擇視窗 ═══
function ask(title, text, buttons) {   // buttons: [[文字, 函式, 主按鈕?]]
  $('modalBox').innerHTML = `<h3>${title}</h3><p>${text}</p>` + buttons.map(([t], i) => `<button data-i="${i}" class="${buttons[i][2] ? 'main' : ''}">${t}</button>`).join('');
  $('modal').style.display = 'flex';
  $('modalBox').querySelectorAll('button').forEach(b => b.onclick = () => { $('modal').style.display = 'none'; const f = buttons[+b.dataset.i][1]; if (f) f(); });
}
const VEHN = ['廢鐵三輪車', '使命必達小貨車', '鐵網皮卡', '越野房車', '裝甲房車', '青晶房車', '履帶堡壘', '末日堡壘', '方舟'];
const saveInfo = x => `${x.hero || '？'}｜第 ${Math.floor((NOW() - x.firstDay) / 86400000) + 1} 天｜${VEHN[(x.tier || 1) - 1]}｜打到 ${(c => c ? (c <= 7 ? '0-' + c : '1-' + (c - 7)) : '0-0')((x.cleared && x.cleared.zero) || 0)}`;
// ═══ 帳號（Google 登入，只用來備份存檔；不存、不顯示 Email） ═══
async function cloudLogin(fromNaming, already) {
  if (!window.Cloud || !Cloud.ready) { toast('帳號系統還沒設定好', 2200); return; }
  if (!already) { try { await Cloud.login(fromNaming ? 'n' : 'h'); } catch (e) { toast('登入沒有完成', 2000); return; } }
  try { sessionStorage.removeItem('zw-login'); } catch (e) {}
  let remote = null; try { remote = await Cloud.pull(); } catch (e) { toast('讀取雲端存檔失敗', 2000); return; }
  const localReal = S.intro === 'done';
  if (remote && !localReal) { S = remote; S.intro = 'done'; save(); toast('已載入雲端存檔', 2000); goHome(); return; }
  if (remote && localReal) {
    ask('找到雲端存檔', `雲端：${saveInfo(remote)}<br>這支手機：${saveInfo(S)}<br>要用哪一個？（另一個會被蓋掉）`, [
      ['用雲端存檔', () => { S = remote; save(); goHome(); toast('已換成雲端存檔'); }, true],
      ['用這支手機的存檔', () => { Cloud.push(S).then(() => toast('已備份到雲端')); renderAcct(); }]]);
    return;
  }
  if (fromNaming) { toast('這個帳號還沒有存檔，先繼續新遊戲吧', 2600); renderAcct(); return; }
  await Cloud.push(S).catch(() => {}); toast('已登入，存檔會自動備份', 2400); renderAcct();
}
function renderAcct() {
  const b = $('acctBtn'); if (!b) return;
  if (!window.Cloud || !Cloud.ready) { b.style.display = 'none'; return; }
  b.style.display = ''; b.textContent = Cloud.user ? '☁ 已備份' : '☁ 登入備份';
}
window.onCloudUser = u => { renderAcct(); if ($('scr-home').classList.contains('on')) renderQuestDot(); let p = null; try { p = sessionStorage.getItem('zw-login'); } catch (e) {} if (u && p) cloudLogin(p === 'n', true); };   // 手機瀏覽器擋彈出視窗、改用整頁跳轉登入時，回來接著做
save();
const day = () => Math.floor((NOW() - S.firstDay) / 86400000) + 1;
const fmt = n => n >= 10000 ? (n / 10000).toFixed(1).replace(/\.0$/, '') + '萬' : Math.floor(n).toLocaleString();
function addDiary(text) { S.diary.push({ day: day(), text }); save(); }

// ═══ 第一次開遊戲的流程：開場影片 → 試玩 → 解說 A → 取名 → 腳踏車劇情 → 首頁（只跑一次） ═══
const params = new URLSearchParams(location.search);
// 2026-11-28 測試版捷徑：網址加 ?ch1=1 → 直接變成「第零章打完」的存檔（保留名字），從第一章開始玩
if (KEY === 'zw-save-test' && params.get('ch1') === '1') {
  S.intro = 'done'; S.hero = S.hero || '阿哲'; S.c0v = 7; S.cleared = S.cleared || {}; S.cleared.zero = 7; S.tier = 2; S.sub = Math.max(S.sub || 0, 2); S.pedalSeen = 7;
  S.flags = Object.assign(S.flags || {}, { trike: 1, turret1: 1, m_team: 1, m_facility: 1, firstUp: 1 }); delete S.flags.kai;
  S.dev = Object.assign(S.dev || {}, { food: 1, scrap: Math.max((S.dev && S.dev.scrap) || 0, 1) });
  S.res = Object.assign(S.res || {}, { scrap: Math.max(S.res.scrap || 0, 800), coin: Math.max(S.res.coin || 0, 600), fuel: Math.max(S.res.fuel || 0, 120), power: Math.max(S.res.power || 0, 60) });
  S.seenRes = Object.assign(S.seenRes || {}, { scrap: 1, power: 1, coin: 1, fuel: 1, core: 1 });
  S.story = S.story || {}; ['c0over', 'c0name', 'c0s1', 'c0s1b', 'c0food', 'c0m2', 'c0s2b', 'c0s3b', 'c0s4', 'c0s4b', 'c0s4c', 'c0s5', 'c0s5b', 'c0m4h', 'c0s6', 'c0s6b', 'c0s8', 'c0s8b', 'c0m6', 'c0m6b', 'c0s10', 'c0s10b'].forEach(k => S.story[k] = 1);
  save(); history.replaceState(null, '', location.pathname);
}
if (params.get('from') === 'trial' && S.intro === 'trial') { S.intro = 'explainA'; save(); history.replaceState(null, '', location.pathname); }
let vidNext = null, vidReplay = false;
let vidOv = null;   // 2026-11-28 影片疊字（字幕、手機訊息、彈窗不燒進影片）
function vidOvTick() {
  const v = $('vid'), box = $('vidOv'); if (!box) return;
  if (!vidOv || !$('scr-video').classList.contains('on')) { box.innerHTML = ''; return; }
  const t = v.currentTime, on = vidOv.overlays.filter(o => t >= o.t0 && t <= o.t1);
  const key = on.map(o => o.t0 + (o.press && t >= o.press ? 'p' : '')).join('|');

    if (ready && S.res) r += `<h4>${tr('倉庫')}</h4>` + RES_N.map(([k, n]) => `<div class="row"><span><img class="ic" src="img/r_${k}.webp" alt="">${tr(n)}</span><span>${k === 'fuel' ? S.res.fuel + ' / ' + FUEL_MAX() : fmt(S.res[k] || 0)}</span></div>`).join('');
    r += `<div class="tip">🖱 ${tr('電腦版用滑鼠點選操作。')}<br>${tr('手機直拿是手機版面；電腦或橫拿平板會自動換成這個版面。')}</div>`;
    ZW_WIDE.set('L', l); ZW_WIDE.set('R', r);
  };
  setInterval(wideTick, 1000); wideTick();
}

<script>
(function () {
  var KEY = 'zw-a2hs-hide', bar = document.getElementById('tmgA2hs'), help = document.getElementById('tmgA2hsHelp');
  var ua = navigator.userAgent || '', deferred = null;
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function track(n, p) { try { window.tmgTrack && window.tmgTrack(n, p); } catch (e) {} }
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var android = /Android/.test(ua);
  var inApp = /Instagram|FBAN|FBAV|FB_IAB|Line\/|TikTok|musical_ly|Bytedance|BytedanceWebview|Threads|Barcelona|MicroMessenger|YouTube|; wv\)/i.test(ua);
  var kind = inApp ? 'inapp' : ios ? 'ios' : android ? 'android' : '';

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('/sw.js').catch(function () {});
  }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; if (!kind) kind = 'android'; maybeShow(); });
  window.addEventListener('appinstalled', function () { bar.classList.remove('show'); store(KEY, 'installed'); track('a2hs_installed'); });

  function maybeShow() {
    if (standalone || !kind || store(KEY)) return;
    if (window.ZW_A2HS_OK && !window.ZW_A2HS_OK()) { setTimeout(maybeShow, 4000); return; }   // 開場、劇情中不打擾
    setTimeout(function () { if (window.ZW_A2HS_OK && !window.ZW_A2HS_OK()) { maybeShow(); return; } bar.classList.add('show'); track('zw_a2hs_banner', { kind: kind }); }, 2500);
  }
  function showHelp(html, arrow) {
    help.querySelector('.card').innerHTML = html + '<button class="ok" type="button">知道了</button>';
    var a = help.querySelector('.arrow');
    if (arrow) { a.textContent = arrow.t; a.style.cssText = 'display:block;' + arrow.pos; } else { a.style.display = 'none'; }
    help.classList.toggle('mid', !!(arrow && arrow.mid));   // 箭頭在下面時，卡片放中間，不會被擋住
    help.classList.add('show');
  }
  help.addEventListener('click', function (e) { if (e.target === help || e.target.classList.contains('ok')) help.classList.remove('show'); });

  bar.querySelector('.x').onclick = function () { bar.classList.remove('show'); store(KEY, 'no'); track('a2hs_dismiss', { kind: kind }); };
  bar.querySelector('.go').onclick = function () {
    track('a2hs_click', { kind: kind });
    if (deferred) {
      deferred.prompt();
      deferred.userChoice.then(function (r) { track('a2hs_choice', { outcome: r.outcome }); if (r.outcome === 'accepted') { bar.classList.remove('show'); store(KEY, 'installed'); } deferred = null; });
      return;
    }
    if (kind === 'inapp') {
      showHelp('<h3>先用瀏覽器打開 👀</h3><ol><li>點右上角的 <span class="ic">⋯</span> 或 <span class="ic">⋮</span></li><li>選「用瀏覽器開啟」' + (ios ? '（Safari）' : '（Chrome）') + '</li><li>打開後再按一次「📲 加入」</li></ol><p style="font-size:14px;opacity:.7;margin:12px 0 0">IG、TikTok、YouTube 裡面的瀏覽器沒辦法加到主畫面</p>',
        { t: '↗', pos: 'top:10px;right:18px' });
    } else if (kind === 'ios') {
      showHelp('<h3>加到主畫面只要 2 步 📲</h3><ol><li>點下方的「分享」按鈕 <span class="ic">⬆︎</span>（方框加向上箭頭）</li><li>往下滑，點「<b>加入主畫面</b>」</li></ol><p style="font-size:14px;opacity:.7;margin:12px 0 0">之後在桌面點「廢域方舟」就能直接玩</p>',
        { t: '⬇', pos: 'bottom:8px;left:50%;margin-left:-14px', mid: true });
    } else {
      showHelp('<h3>加到主畫面只要 2 步 📲</h3><ol><li>點右上角的 <span class="ic">⋮</span></li><li>點「<b>加到主畫面</b>」或「<b>安裝應用程式</b>」</li></ol>',
        { t: '↗', pos: 'top:10px;right:18px' });
    }
  };
  // 設定裡的「手動加到主畫面」按鈕（不管提示條有沒有被關掉都能用）
  window.zwA2hsManual = function () {
    track('a2hs_manual', { kind: kind, standalone: standalone });
    if (standalone) {
      showHelp('<h3>你現在是從主畫面的捷徑打開的</h3><ol><li>用手機的瀏覽器（Chrome 或 Safari）打開<br><b>talkmakesgames.github.io/zero-test/</b></li><li>在那裡再按一次「📲 加到主畫面」</li></ol><p style="font-size:14px;opacity:.7;margin:12px 0 0">如果主畫面已經有「廢域方舟」，就不用再加了</p>');
      return;
    }
    if (!kind) kind = 'android';
    bar.querySelector('.go').onclick();
  };
  maybeShow();
})();
</script>

const DT = 1 / 60;
function step() {

    ctx.fillStyle = '#4caf50'; for (const [a, b, s] of [[-0.55, -0.55, 0.45], [0.55, -0.55, 0.45], [0, -0.85, 0.5], [-0.25, -0.35, 0.4], [0.28, -0.32, 0.4]]) { ctx.beginPath(); ctx.arc(a * r, b * r, s * r, 0, 7); ctx.fill(); ctx.stroke(); }
    ctx.translate(0, r * 0.25); zEyes(r * 0.75, e.hitT > 0);
  } else if (e.type === 'carrot') {
    zArms(r, e.ph * 1.5, dir);
    ctx.fillStyle = '#ff8a2b'; ctx.beginPath(); ctx.moveTo(-r * 0.8, -r * 0.7); ctx.quadraticCurveTo(0, -r * 1.0, r * 0.8, -r * 0.7); ctx.lineTo(0, r * 1.1); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#4fb34f'; for (const k of [-1, 0, 1]) { ctx.beginPath(); ctx.ellipse(k * r * 0.3, -r * 1.05, r * 0.16, r * 0.4, k * 0.4, 0, 7); ctx.fill(); ctx.stroke(); }
    zEyes(r * 0.8, e.hitT > 0);
    if (e.dashT < 0.55 && e.dashT > 0 && G.freeze <= 0) { ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 3; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(-dir * r * 1.2, -r * 0.4 + i * r * 0.4); ctx.lineTo(-dir * r * 2, -r * 0.4 + i * r * 0.4); ctx.stroke(); } }
  } else {
    zArms(r, e.ph * 0.7, dir);
    ctx.fillStyle = '#f39c3c'; ctx.beginPath(); ctx.ellipse(0, 0, r * 1.1, r * 0.92, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(160,80,20,.6)'; for (const k of [-0.5, 0, 0.5]) { ctx.beginPath(); ctx.ellipse(k * r, 0, r * 0.3, r * 0.88, 0, 0, 7); ctx.stroke(); }
    ctx.strokeStyle = '#3a1e0f'; ctx.fillStyle = '#6d4c2f'; rr(-r * 0.12, -r * 1.15, r * 0.24, r * 0.3, 4); ctx.fill(); ctx.stroke();
    zEyes(r * 0.85, e.hitT > 0);
  }
  ctx.restore();
  // 血條
  if (e.hp < e.max) { const w = r * 2; ctx.fillStyle = 'rgba(0,0,0,.45)'; rr(e.x - w / 2, e.y - r * 1.7, w, 6, 3); ctx.fill(); ctx.fillStyle = e.hp / e.max > 0.4 ? '#7bd36b' : '#ff6b6b'; rr(e.x - w / 2, e.y - r * 1.7, w * clamp(e.hp / e.max), 6, 3); ctx.fill(); }
}

// ---------- 零食道具（程式畫的） ----------
function drawTower(t) {
  const k = easeOutBack(t.pop), lv = t.lv;
  ctx.save(); ctx.translate(t.x, t.y); ctx.scale(k, k);
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(0, 14, 24, 8, 0, 0, 7); ctx.fill();
  ctx.fillStyle = ['#fff3d6', '#ffe08a', '#ffc94d'][lv]; ctx.strokeStyle = '#3a1e0f'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 4, 24, 0, 7); ctx.fill(); ctx.stroke();
  ctx.translate(-Math.cos(t.ang) * t.kick * 4, -Math.sin(t.ang) * t.kick * 4);
  if (t.type === 'chips') {
    ctx.fillStyle = '#e63946'; rr(-13, -22, 26, 30, 5); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#ffd84d'; ctx.beginPath(); ctx.ellipse(0, -10, 8, 6, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffd25a'; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(-8 + i * 8, -24, 6, 4, 0.3, 0, 7); ctx.fill(); ctx.stroke(); }
  } else if (t.type === 'cola') {
    ctx.fillStyle = '#c62828'; rr(-12, -26, 24, 34, 6); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#fff'; ctx.fillRect(-12, -12, 24, 7); ctx.fillStyle = '#bbb'; rr(-10, -30, 20, 6, 3); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#3a1e0f'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, -30); ctx.lineTo(Math.cos(t.ang) * 14, -30 + Math.sin(t.ang) * 14); ctx.stroke();
  } else {
    ctx.fillStyle = '#e63946'; rr(-15, -24, 30, 32, 4); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#fff'; for (let i = 0; i < 3; i++) ctx.fillRect(-15 + i * 11, -24, 5, 32);
    ctx.fillStyle = '#fff8dc'; for (const [a, b] of [[-8, -28], [0, -32], [8, -28], [-3, -26], [5, -25]]) { ctx.beginPath(); ctx.arc(a, b, 5, 0, 7); ctx.fill(); ctx.stroke(); }
  }
  ctx.restore();
  for (let i = 0; i <= lv; i++) txt('★', t.x - lv * 7 + i * 14, t.y + 30, 13, '#ffd84d', { stroke: 3 });
}

function drawShot(s) {
  if (s.type === 'chips') { ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.life * 20); ctx.fillStyle = '#ffd25a'; ctx.strokeStyle = '#3a1e0f'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(0, 0, 6, 4, 0, 0, 7); ctx.fill(); ctx.stroke(); ctx.restore(); }
  else if (s.type === 'cola') { ctx.fillStyle = 'rgba(120,60,20,.85)'; ctx.beginPath(); ctx.arc(s.x, s.y, 6, 0, 7); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.arc(s.x - 2, s.y - 2, 2, 0, 7); ctx.fill(); }
  else { const tot = Math.hypot(s.tx - s.from.x, s.ty - s.from.y) || 1, left = Math.hypot(s.tx - s.x, s.ty - s.y), arc = Math.sin(Math.PI * (1 - left / tot)) * 40;
    ctx.fillStyle = '#fff8dc'; ctx.strokeStyle = '#3a1e0f'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(s.x, s.y - arc, 8, 0, 7); ctx.fill(); ctx.stroke(); }
}
function drawFx(f) {
  const u = f.t;
  if (f.kind === 'dmg') txt(String(f.v), f.x + Math.sin(f.v) * 6, f.y - u * 40, 15, '#fff', { stroke: 3, a: 1 });
  else if (f.kind === 'text') { ctx.globalAlpha = clamp(1.4 - u); txt(f.text, f.x, f.y - u * 30, 22, f.col, { stroke: 5 }); ctx.globalAlpha = 1; }
  else if (f.kind === 'coin') { ctx.globalAlpha = clamp(1 - u * 1.4); txt('+' + f.v + '⚡', f.x, f.y - 20 - u * 30, 14, '#ffd84d', { stroke: 3 }); ctx.globalAlpha = 1; }
  else if (f.kind === 'pop') { for (let i = 0; i < 8; i++) { const a = i / 8 * 6.28, r = 8 + u * 50; ctx.fillStyle = f.type === 'broc' ? '#4caf50' : f.type === 'carrot' ? '#ff8a2b' : '#f39c3c'; ctx.globalAlpha = clamp(1 - u * 1.5); ctx.beginPath(); ctx.arc(f.x + Math.cos(a) * r, f.y + Math.sin(a) * r, 5 * (1 - u), 0, 7); ctx.fill(); } ctx.globalAlpha = 1; }
  else if (f.kind === 'boom') { ctx.globalAlpha = clamp(1 - u * 1.6); ctx.fillStyle = '#fff8dc'; for (let i = 0; i < 10; i++) { const a = i * 0.63, r = f.r * (0.3 + u * 1.2); ctx.beginPath(); ctx.arc(f.x + Math.cos(a) * r, f.y + Math.sin(a) * r, 7, 0, 7); ctx.fill(); } ctx.strokeStyle = '#ffd84d'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.4 + u), 0, 7); ctx.stroke(); ctx.globalAlpha = 1; }
  else if (f.kind === 'fizz') { ctx.globalAlpha = clamp(1 - u * 1.5); ctx.fillStyle = 'rgba(150,90,40,.35)'; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.5 + u * 0.6), 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
  else if (f.kind === 'puff') { ctx.globalAlpha = clamp(1 - u * 1.6); ctx.fillStyle = '#fff'; for (let i = 0; i < 6; i++) { const a = i * 1.05; ctx.beginPath(); ctx.arc(f.x + Math.cos(a) * u * 40, f.y + Math.sin(a) * u * 30, 10 * (1 - u), 0, 7); ctx.fill(); } ctx.globalAlpha = 1; }
  else if (f.kind === 'tvoff') { ctx.globalAlpha = clamp(0.9 - u); ctx.fillStyle = '#9fe3ff'; ctx.fillRect(0, 0, VW, VH); ctx.globalAlpha = 1; txt('📺 遙控器關機！', 270, 480 - u * 20, 44, '#fff', { stroke: 9 }); }
}

// ---------- 介面 ----------
const UI = {
  next: { x: 452, y: 46, w: 160, h: 60 }, skill: { x: 78, y: 912, w: 130, h: 72 }, speed: { x: 462, y: 912, w: 130, h: 72 },
};
function inBox(b, x, y) { return Math.abs(x - b.x) <= b.w / 2 && Math.abs(y - b.y) <= b.h / 2; }
function drawHUD() {
  // 上方
  ctx.fillStyle = 'rgba(58,30,15,.85)'; rr(8, 10, 360, 72, 20); ctx.fill();
  txt('❤️ ' + G.hearts, 62, 46, 26, '#fff', { align: 'center' });
  txt('⚡ ' + Math.floor(G.energy), 170, 40, 26, '#ffd84d');
  if (G.lazyMul > 1.05) txt('懶惰加成 ×' + G.lazyMul.toFixed(1), 170, 66, 13, '#9be36b', { w: 800 });
  txt('第 ' + G.wave + ' / ' + WAVES.length + ' 波', 300, 46, 20, '#fff');
  // 下一波按鈕（附預告）
  const canNext = G.wave < WAVES.length && G.state !== 'win' && G.state !== 'lose' && !(G.state === 'wave' && G.spawns.length);
  const b = UI.next; ctx.globalAlpha = canNext ? 1 : 0.45; ctx.fillStyle = G.wave === 0 ? '#ff5a4f' : '#ffd84d'; ctx.strokeStyle = '#3a1e0f'; ctx.lineWidth = 4;
  const pulse = G.wave === 0 && canNext ? 1 + Math.sin(G.t * 6) * 0.04 : 1; ctx.save(); ctx.translate(b.x, b.y); ctx.scale(pulse, pulse);
  rr(-b.w / 2, -b.h / 2, b.w, b.h, 18); ctx.fill(); ctx.stroke();
  txt(G.wave === 0 ? '▶ 開始！' : '▶ 下一波', 0, -8, 21, G.wave === 0 ? '#fff' : '#3a1e0f');
  if (G.wave < WAVES.length) { const icons = [...new Set(WAVES[G.wave].map(w => w[0]))].map(k => ({ broc: '🥦', carrot: '🥕', pumpkin: '🎃' })[k]).join(''); txt(icons + (G.state === 'wave' && canNext ? ' +' + EARLY_BONUS + '⚡' : ''), 0, 16, 14, G.wave === 0 ? '#fff' : '#3a1e0f', { w: 800 }); }
  ctx.restore(); ctx.globalAlpha = 1;
  // 下方：技能、速度
  const s = UI.skill, ready = G.skillCD <= 0; ctx.fillStyle = ready ? '#9fe3ff' : '#cfd8dc'; ctx.strokeStyle = '#3a1e0f'; ctx.lineWidth = 4; rr(s.x - s.w / 2, s.y - s.h / 2, s.w, s.h, 18); ctx.fill(); ctx.stroke();
  txt('📺', s.x - 34, s.y, 30, '#000'); txt(ready ? '關機！' : Math.ceil(G.skillCD) + '秒', s.x + 18, s.y - 6, 20, '#3a1e0f'); txt('全部定住', s.x + 18, s.y + 18, 11, '#3a1e0f', { w: 800 });
  if (!ready) { ctx.fillStyle = 'rgba(58,30,15,.25)'; rr(s.x - s.w / 2, s.y - s.h / 2, s.w * (G.skillCD / 30), s.h, 18); ctx.fill(); }
  const v = UI.speed; ctx.fillStyle = G.speed > 1 ? '#ffd84d' : '#fff8ee'; ctx.strokeStyle = '#3a1e0f'; rr(v.x - v.w / 2, v.y - v.h / 2, v.w, v.h, 18); ctx.fill(); ctx.stroke(); txt(G.speed > 1 ? '⏩ 2 倍' : '▶ 1 倍', v.x, v.y, 22, '#3a1e0f');
  txt('原型 v0.1・美術是暫時的', 270, 912, 12, 'rgba(58,30,15,.55)', { w: 800 });
  // 對話泡泡
  if (G.bubble) { const B = G.bubble, k = easeOutBack(B.k), who = B.who; const bx = who === 'hua' ? 290 : 270, by = who === 'hua' ? 118 : 740;
    ctx.save(); ctx.translate(bx, by); ctx.scale(k, k); ctx.font = '900 17px ' + FONT; const w = Math.min(420, ctx.measureText(B.text).width + 30);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#3a1e0f'; ctx.lineWidth = 3; rr(-w / 2, -20, w, 40, 16); ctx.fill(); ctx.stroke(); txt(B.text, 0, 1, 17, '#3a1e0f'); ctx.restore(); }
}
function drawMenu() {
  const m = G.menu; if (!m) return; const pad = m.pad, k = easeOutBack(m.k);
  if (pad.tower) { // 升級／賣掉
    const t = pad.tower, S = TOWERS[t.type].lv[t.lv]; ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(t.x, t.y, S.range, 0, 7); ctx.fill(); ctx.stroke();
    for (const btn of menuButtons()) drawBtn(btn, k);
    txt(TOWERS[t.type].name + ' LV' + (t.lv + 1), clamp(pad.x, 90, 450), pad.y + (pad.y < 300 ? -40 : 62), 15, '#fff', { stroke: 4 });
  } else { // 選道具
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.setLineDash([6, 6]); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(pad.x, pad.y, TOWERS.chips.lv[0].range, 0, 7); ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.arc(pad.x, pad.y, 26, 0, 7); ctx.fill();
    for (const btn of menuButtons()) drawBtn(btn, k);
  }
}
function menuButtons() {
  const m = G.menu; if (!m) return []; const p = m.pad, cx = clamp(p.x, 92, VW - 92), cy = p.y, dn = p.y < 300 ? -1 : 1;   // 上方的空位：選單往下開
  if (p.tower) { const t = p.tower, nx = TOWERS[t.type].lv[t.lv + 1];
    return [{ id: 'up', x: cx - 50, y: cy - 62 * dn, label: nx ? '升級' : '滿級', sub: nx ? nx.up + '⚡' : '', ok: !!nx && G.energy >= nx.up, col: '#9be36b' },
            { id: 'sell', x: cx + 50, y: cy - 62 * dn, label: '賣掉', sub: '+' + Math.round(t.invested * 0.6) + '⚡', ok: true, col: '#ffb4a8' }]; }
  const ks = Object.keys(TOWERS); return ks.map((key, i) => ({ id: key, x: cx + (i - 1) * 82, y: cy - (70 + (i === 1 ? 14 : 0)) * dn, label: TOWERS[key].icon, sub: TOWERS[key].cost + '⚡', ok: G.energy >= TOWERS[key].cost, col: '#fff8ee', name: TOWERS[key].name, desc: TOWERS[key].desc }));
}
function drawBtn(b, k) { ctx.save(); ctx.translate(b.x, b.y); ctx.scale(k, k); ctx.globalAlpha = b.ok ? 1 : 0.5; ctx.fillStyle = b.col; ctx.strokeStyle = '#3a1e0f'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 34, 0, 7); ctx.fill(); ctx.stroke();
  txt(b.label, 0, -6, b.label.length > 2 ? 17 : 28, '#3a1e0f'); txt(b.sub, 0, 20, 12, b.ok ? '#3a1e0f' : '#a33', { w: 900 }); ctx.restore(); ctx.globalAlpha = 1;
  if (b.name) txt(b.name, b.x, b.y + 46, 11, '#fff', { stroke: 3, w: 800 }); if (b.desc) txt(b.desc, b.x, b.y + 61, 10, '#ffd84d', { stroke: 3, w: 800 }); }
function drawTutorial() {   // 新手引導：第一個道具、按開始
  if (G.wave > 0 || G.menu || G.state !== 'build') return; const b = Math.sin(G.t * 6) * 6;
  if (G.towers.length === 0) { const p = G.pads[1]; ctx.strokeStyle = '#ff5a4f'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(p.x, p.y, 30 + b * 0.5, 0, 7); ctx.stroke();
    txt('👇', p.x, p.y - 52 + b, 34, '#000'); txt('點空位，擺零食守沙發！', 270, 400, 24, '#fff', { stroke: 6 }); }
  else { txt('👆', 452, 108 - b, 34, '#000'); txt('準備好了就按「開始」', 290, 118, 20, '#fff', { stroke: 5 }); }
}
function drawEnd() {
  const u = easeOutBack(G.endT / 0.4); if (G.endT < 0.3 && G.state === 'lose') return;
  ctx.fillStyle = 'rgba(42,29,20,' + clamp(G.endT * 1.5) * 0.55 + ')'; ctx.fillRect(0, 0, VW, VH);
  ctx.save(); ctx.translate(270, 430); ctx.scale(u, u); ctx.fillStyle = '#fff8ee'; ctx.strokeStyle = '#3a1e0f'; ctx.lineWidth = 6; rr(-210, -150, 420, 300, 28); ctx.fill(); ctx.stroke();
  if (G.state === 'win') { txt('守住沙發了！', 0, -100, 40, '#ffd84d', { stroke: 9 }); txt('★'.repeat(G.stars) + '☆'.repeat(3 - G.stars), 0, -40, 46, '#ffd84d', { stroke: 6 }); txt('剩下 ' + G.hearts + ' ❤️・打倒 ' + G.kills + ' 隻', 0, 15, 20, '#3a1e0f'); }
  else { txt('沙發被搶走了……', 0, -100, 36, '#ff7a6b', { stroke: 8 }); txt('撐到第 ' + G.wave + ' 波・打倒 ' + G.kills + ' 隻', 0, -35, 20, '#3a1e0f'); txt(G.wave <= 4 ? '提示：路線轉彎的地方最好打' : G.wave <= 7 ? '提示：可樂讓殭屍變慢，爆米花一次炸一群' : '提示：南瓜很硬，記得升級道具', 0, 5, 15, '#a0663a'); }
  rr(-110, 55, 220, 60, 30); ctx.fillStyle = '#ffd84d'; ctx.fill(); ctx.stroke(); txt('再玩一次', 0, 86, 24, '#3a1e0f');
  ctx.restore();
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#2a1d14'; ctx.fillRect(0, 0, cv.width, cv.height);
  const sh = G.shake > 0.3 ? G.shake : 0; ctx.setTransform(scale * dpr, 0, 0, scale * dpr, (offX + (Math.random() - 0.5) * sh * scale) * dpr, (offY + (Math.random() - 0.5) * sh * scale) * dpr);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.clip();
  drawRoom();
  for (const p of G.pads) if (!p.tower) { ctx.strokeStyle = 'rgba(58,30,15,.45)'; ctx.setLineDash([5, 5]); ctx.lineWidth = 2.5; ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(p.x, p.y, 24, 0, 7); ctx.fill(); ctx.stroke(); ctx.setLineDash([]); txt('+', p.x, p.y + 1, 22, 'rgba(58,30,15,.5)'); }
  drawHua(); drawSofa();
  const list = [...G.enemies].sort((a, b) => a.y - b.y); for (const e of list) drawEnemy(e);
  for (const t of G.towers) drawTower(t);
  for (const s of G.shots) drawShot(s);
  for (const f of G.fx) drawFx(f);
  if (G.freeze > 0) { ctx.fillStyle = 'rgba(159,227,255,.15)'; ctx.fillRect(0, 0, VW, VH); }
  drawHUD(); drawMenu(); drawTutorial();
  if (G.state === 'win' || G.state === 'lose') drawEnd();
  ctx.restore();
}

// ---------- 操作 ----------
function toView(e) { const r = cv.getBoundingClientRect(); const x = (e.clientX - r.left) * (cv.width / r.width) / dpr, y = (e.clientY - r.top) * (cv.height / r.height) / dpr; return [(x - offX) / scale, (y - offY) / scale]; }
function tap(x, y) {
  sfxInit();
  if (G.state === 'win' || G.state === 'lose') { if (G.endT > 0.6 && Math.abs(x - 270) < 110 && Math.abs(y - 516) < 30) reset(); return; }
  if (G.menu) { for (const b of menuButtons()) if (Math.hypot(x - b.x, y - b.y) < 38) { const p = G.menu.pad;
        if (b.id === 'up') upgrade(p.tower); else if (b.id === 'sell') sell(p); else if (b.ok) build(p, b.id); G.menu = null; return; } }
  if (inBox(UI.next, x, y)) { startWave(); G.menu = null; return; }
  if (inBox(UI.skill, x, y)) { useSkill(); return; }
  if (inBox(UI.speed, x, y)) { G.speed = G.speed > 1 ? 1 : 2; return; }
  const pad = G.pads.find(p => Math.hypot(x - p.x, y - p.y) < 34);
  G.menu = pad && (!G.menu || G.menu.pad !== pad) ? { pad, k: 0 } : null;
}
cv.addEventListener('pointerdown', e => { const [x, y] = toView(e); tap(x, y); });

function layout() {
  if (REC) { cv.width = 1080; cv.height = 1920; dpr = 1; scale = 2; offX = offY = 0; cv.style.width = '540px'; cv.style.height = '960px'; return; }
  dpr = Math.min(2, devicePixelRatio || 1); const W = innerWidth, H = innerHeight; scale = Math.min(W / VW, H / VH); offX = (W - VW * scale) / 2; offY = (H - VH * scale) / 2;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
}
addEventListener('resize', layout);

// ---------- 主迴圈 ----------
let acc = 0, last = 0;
function loop(now) {
  if (!SIM && !REC) { acc += Math.min(100, now - (last || now)); last = now; while (acc >= 1000 / 60) { for (let i = 0; i < G.speed; i++) step(); acc -= 1000 / 60; } if (G.menu) G.menu.k = Math.min(1, G.menu.k + 0.15); render(); }
  requestAnimationFrame(loop);
}
reset(); layout();
// 機器人測試介面（開發用）
window.__dev = { G, DIFF, TOWERS, ENEMIES, WAVES, PADS, build: (i, type) => build(G.pads[i], type), upgrade: i => G.pads[i].tower && upgrade(G.pads[i].tower), sell: i => sell(G.pads[i]),
  startWave, useSkill, reset: s => { seed = s || 1; reset(); }, step: n => { for (let i = 0; i < (n || 1); i++) step(); }, render, tap,
  url: q => cv.toDataURL('image/jpeg', q || 0.9) };
requestAnimationFrame(loop);
})();
</script>

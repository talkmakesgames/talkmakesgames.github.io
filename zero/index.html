<script>
"use strict";
// ═══════════════ 零號廢域：戰鬥原型（回合制轉珠合成） ═══════════════
const W = 540, H = 960;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let SCALE = 1, DPR = 1;
function fit() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  SCALE = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * SCALE) + 'px'; cv.style.height = (H * SCALE) + 'px';
  cv.width = Math.round(W * SCALE * DPR); cv.height = Math.round(H * SCALE * DPR);
  cv.style.marginTop = Math.max(0, (innerHeight - H * SCALE) / 2) + 'px';
}
addEventListener('resize', fit); fit();

// ── 亂數（可設種子，給模擬試玩用） ──
let seed = (Date.now() % 100000) | 0;
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const ri = n => Math.floor(rnd() * n);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

// ── 版面 ──
const COLS = 6, ROWS = 5, CELL = 86, BX = (W - COLS * CELL) / 2, BY = 506;
const FIELD_H = 392;               // 戰場高度
const RV = { x: 28, y: 300, w: 270, h: 74 };
const TURRETS = [{ x: 78, kind: 0 }, { x: 160, kind: 1 }, { x: 242, kind: 2 }];   // 閃電、火焰、機槍
const HERO = { x: 70, y: 470 };
const CYAN = '#3ff0ff', RED = '#ff2d3c';

const TYPES = [
  { name: '電路', fx: '閃電砲', color: '#3ff0ff', dark: '#0b4a55' },
  { name: '燃料', fx: '火焰砲', color: '#ff5240', dark: '#5a1410' },
  { name: '彈藥', fx: '機槍', color: '#ffd23f', dark: '#5a4608' },
  { name: '鋼鐵', fx: '修補', color: '#a9b3bd', dark: '#2c3238' },
  { name: '能量', fx: 'AI 充能', color: '#b46bff', dark: '#33155a' },
];

const KINDS = {
  zombie: { name: '機械殭屍', hp: 115, cd: 2, atk: 9, s: 1.0 },
  dasher: { name: '衝刺型', hp: 62, cd: 1, atk: 6, s: 0.9 },
  heavy: { name: '重裝型', hp: 260, cd: 3, atk: 16, s: 1.15 },
  boss: { name: '巨型機甲', hp: 1250, cd: 3, atk: 22, s: 1.0 },
};
const WAVES = [
  ['zombie', 'zombie', 'dasher'],
  ['zombie', 'dasher', 'heavy', 'dasher'],
  ['heavy', 'zombie', 'dasher', 'zombie', 'heavy'],
  ['boss'],
];
const CARDS = [
  { id: 'light', t: '閃電砲強化', d: '閃電砲傷害 +30%' },
  { id: 'burn', t: '燃燒彈', d: '火焰砲附加燃燒\n敵人每回合再受傷' },
  { id: 'time', t: '神經加速', d: '轉珠時間 +1 秒' },
  { id: 'armor', t: '加厚裝甲', d: '房車裝甲上限 +20\n並且補滿' },
  { id: 'plus', t: '精密合成', d: '高級零件門檻\n從 5 個降為 4 個' },
  { id: 'energy', t: 'AI 超頻', d: 'AI 充能速度 +50%' },
  { id: 'steel', t: '鋼鐵尖刺', d: '鋼鐵零件也會\n造成少量傷害' },
];
const AI_LINES = {
  start: ['連線完成。別期待我會安慰你。', '敵人接近。建議你動手，而不是發呆。'],
  combo: ['不錯。你的手比你的腦袋有用。', '連擊有效。繼續保持，別得意。', '這種程度……勉強及格。'],
  hurt: ['裝甲受損。我建議你認真一點。', '再被打幾下，我們就一起變廢鐵。'],
  low: ['裝甲剩 30%。我建議你認真一點。'],
  boss: ['存活機率 3%。不過你的運氣一向很差。'],
  emp: ['過載 EMP。看好，這才叫效率。'],
  full: ['能量滿了。點我。別讓我說第二次。'],
  win: ['……你居然活下來了。數據異常。'],
  lose: ['房車失去機能。下次記得先動腦。'],
  wave: ['這波清除。下一波更麻煩，別鬆懈。'],
};
const pick = a => a[ri(a.length)];

// ── 遊戲狀態 ──
let G;
function newGame(s) {
  if (s != null) seed = s;
  G = {
    state: 'title', t: 0, board: [], held: null, dragX: 0, dragY: 0, swapped: false, timer: 0, timeLimit: 6,
    wave: 0, enemies: [], armor: 120, armorMax: 120, energy: 0, combo: 0, maxCombo: 0, totalDmg: 0, turns: 0, parts: 0,
    queue: [], groups: [], phaseT: 0, attackIdx: 0, enemyIdx: 0,
    mods: { light: 1, burn: false, time: 0, plus: 5, energy: 1, steel: false },
    fx: [], parts_: [], texts: [], shake: 0, slow: 0, flash: 0, comboShow: 0,
    hero: { pose: 0, poseT: 0, glow: 0, hurt: 0 },
    ai: { x: 330, y: 292, ox: 0, line: '', lineT: 0, hurtMove: 0, lowSaid: false, fullSaid: false },
    turretAng: [-1.2, -1.4, -1.6], turretKick: [0, 0, 0],
    cards: null, cardT: 0, bannerText: '', bannerT: 0, bossTaunt: 0, result: null, empT: 0,
  };
  G.board = makeBoard();
}
function makeCell(t, c, r, fromY) {
  const p = cellPos(c, r);
  return { t, plus: false, x: p.x, y: fromY != null ? fromY : p.y, vy: 0, s: 1, born: 0 };
}
function cellPos(c, r) { return { x: BX + c * CELL + CELL / 2, y: BY + r * CELL + CELL / 2 }; }
function makeBoard() {
  const b = [];
  for (let r = 0; r < ROWS; r++) {
    b.push([]);
    for (let c = 0; c < COLS; c++) {
      let t;
      do { t = ri(5); } while ((c >= 2 && b[r][c - 1].t === t && b[r][c - 2].t === t) || (r >= 2 && b[r - 1][c].t === t && b[r - 2][c].t === t));
      b[r].push(makeCell(t, c, r));
    }
  }
  return b;
}

// ── 找出可以合成的組合 ──
function findGroups(b) {
  const mark = [...Array(ROWS)].map(() => Array(COLS).fill(false));
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS - 2; c++) {
    const a = b[r][c]; if (!a) continue;
    if (b[r][c + 1] && b[r][c + 2] && b[r][c + 1].t === a.t && b[r][c + 2].t === a.t) { mark[r][c] = mark[r][c + 1] = mark[r][c + 2] = true; }
  }
  for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS - 2; r++) {
    const a = b[r][c]; if (!a) continue;
    if (b[r + 1][c] && b[r + 2][c] && b[r + 1][c].t === a.t && b[r + 2][c].t === a.t) { mark[r][c] = mark[r + 1][c] = mark[r + 2][c] = true; }
  }
  const seen = [...Array(ROWS)].map(() => Array(COLS).fill(false)), groups = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (!mark[r][c] || seen[r][c]) continue;
    const t = b[r][c].t, cells = [], st = [[c, r]]; seen[r][c] = true;
    while (st.length) {
      const [x, y] = st.pop(); cells.push([x, y]);
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS || seen[ny][nx] || !mark[ny][nx] || b[ny][nx].t !== t) continue;
        seen[ny][nx] = true; st.push([nx, ny]);
      }
    }
    groups.push({ t, cells, plus: cells.some(([x, y]) => b[y][x].plus) });
  }
  // 由下往上、由左往右結算（看起來比較自然）
  groups.sort((g1, g2) => Math.max(...g2.cells.map(c => c[1])) - Math.max(...g1.cells.map(c => c[1])));
  return groups;
}

// ── 音效（Web Audio 程式合成） ──
let AC = null, MASTER = null, NOISE = null;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    MASTER = AC.createGain(); MASTER.gain.value = 0.55; MASTER.connect(AC.destination);
    NOISE = AC.createBuffer(1, AC.sampleRate * 1.5, AC.sampleRate);
    const d = NOISE.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(f0, f1, dur, type, vol, delay) {
  if (!AC) return; const t = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.3, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(MASTER); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol, fLo, fHi, delay) {
  if (!AC) return; const t = AC.currentTime + (delay || 0);
  const s = AC.createBufferSource(); s.buffer = NOISE;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(fHi || 1200, t); f.frequency.exponentialRampToValueAtTime(fLo || 200, t + dur); f.Q.value = 0.8;
  const g = AC.createGain(); g.gain.setValueAtTime(vol || 0.4, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(MASTER); s.start(t); s.stop(t + dur + 0.05);
}
const SFX = {
  swap: () => tone(520, 600, 0.04, 'triangle', 0.06),
  pop: k => { const f = 330 * Math.pow(2, Math.min(k, 14) / 12 * 1.5); tone(f, f * 1.5, 0.12, 'square', 0.12); tone(f * 2, f * 2.2, 0.08, 'sine', 0.08); },
  charge: () => tone(300, 1200, 0.18, 'sawtooth', 0.07),
  zap: () => { noise(0.18, 0.35, 800, 6000); tone(1400, 300, 0.15, 'square', 0.08); },
  fire: () => noise(0.35, 0.4, 150, 1500),
  mg: () => { for (let i = 0; i < 4; i++) { noise(0.05, 0.35, 400, 3000, i * 0.06); } },
  heal: () => { tone(520, 780, 0.15, 'triangle', 0.12); tone(780, 1040, 0.15, 'triangle', 0.1, 0.08); },
  energy: () => tone(400, 900, 0.2, 'sine', 0.12),
  boom: () => { noise(0.5, 0.6, 60, 900); tone(120, 40, 0.4, 'sine', 0.35); },
  hit: () => { tone(90, 40, 0.25, 'sine', 0.45); noise(0.2, 0.4, 100, 800); },
  card: () => { tone(660, 990, 0.12, 'triangle', 0.15); },
  emp: () => { tone(80, 1600, 0.5, 'sawtooth', 0.15); noise(0.6, 0.5, 200, 5000, 0.1); },
  win: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, f, 0.3, 'triangle', 0.18, i * 0.13)),
  lose: () => [392, 330, 262, 196].forEach((f, i) => tone(f, f * 0.98, 0.35, 'sawtooth', 0.12, i * 0.18)),
  boss: () => { tone(60, 45, 1.2, 'sawtooth', 0.3); noise(1.0, 0.4, 60, 400); },
};

// ── 波次 ──
function spawnWave() {
  const list = WAVES[G.wave], n = list.length, sc = 1 + 0.12 * G.wave;
  G.enemies = list.map((k, i) => {
    const K = KINDS[k], boss = k === 'boss';
    const x = boss ? W / 2 : lerp(80, W - 80, n === 1 ? 0.5 : i / (n - 1));
    const y = boss ? 185 : 150 + ((i % 2) ? 60 : 0) + (k === 'heavy' ? -10 : 0) + (k === 'dasher' ? 20 : 0);
    return { k, K, hp: Math.round(K.hp * (boss ? 1 : sc)), maxHp: Math.round(K.hp * (boss ? 1 : sc)), cd: K.cd, cdMax: K.cd, atk: K.atk,
      x, y: -120 - i * 30, tx: x, ty: y, hit: 0, dead: false, dieT: 0, stun: false, burn: 0, lunge: 0, enraged: false, bob: rnd() * 6 };
  });
  G.bannerText = G.wave === 3 ? '⚠ 頭目來襲' : `第 ${G.wave + 1} 波`; G.bannerT = 1.6;
  if (G.wave === 3) {
    G.shake = 18; SFX.boss(); G.bossTaunt = 3.2; G.ai.lineT = 0;
    setTimeout(() => say(AI_LINES.boss[0]), 1800);
  }
}
function alive() { return G.enemies.filter(e => !e.dead); }
function frontEnemy() {
  const a = alive(); if (!a.length) return null;
  return a.slice().sort((p, q) => q.ty - p.ty || p.tx - q.tx)[0];
}
function say(s) { G.ai.line = s; G.ai.lineT = 2.8; }

// ── 主流程 ──
function startGame() {
  newGame(); G.state = 'intro'; G.phaseT = 0; spawnWave(); say(pick(AI_LINES.start));
}
function update(dt) {
  G.t += dt;
  const ts = G.slow > 0 ? 0.35 : 1; if (G.slow > 0) G.slow -= dt;
  const d = dt * ts;
  // 動畫：盤面零件落下、縮放
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const p = G.board[r][c]; if (!p) continue;
    const tp = cellPos(c, r);
    if (G.held && G.held.c === c && G.held.r === r && G.state === 'drag') continue;
    if (p.y < tp.y) { p.vy += 2600 * d; p.y = Math.min(tp.y, p.y + p.vy * d); if (p.y === tp.y) { p.vy = 0; p.s = 1.18; } }
    else { p.y = lerp(p.y, tp.y, 1 - Math.pow(0.0001, d)); p.vy = 0; }
    p.x = lerp(p.x, tp.x, 1 - Math.pow(0.00001, d));
    p.s = lerp(p.s, 1, 1 - Math.pow(0.001, d));
    if (p.born < 1) p.born = Math.min(1, p.born + d * 4);
  }
  // 敵人進場、受擊
  for (const e of G.enemies) {
    e.x = lerp(e.x, e.tx, 1 - Math.pow(0.02, d)); e.y = lerp(e.y, e.ty, 1 - Math.pow(0.02, d));
    if (e.hit > 0) e.hit -= d * 4; if (e.lunge > 0) e.lunge -= d * 2.2;
    if (e.dead) e.dieT += d;
  }
  G.enemies = G.enemies.filter(e => !e.dead || e.dieT < 1.2);
  // 特效
  for (const f of G.fx) f.t += d; G.fx = G.fx.filter(f => f.t < f.dur);
  for (const p of G.parts_) { p.t += d; p.x += p.vx * d; p.y += p.vy * d; p.vy += (p.g || 900) * d; p.rot += p.vr * d; }
  G.parts_ = G.parts_.filter(p => p.t < p.life);
  for (const t of G.texts) { t.t += d; t.y -= 40 * d; }
  G.texts = G.texts.filter(t => t.t < t.life);
  G.shake = Math.max(0, G.shake - dt * 40); G.flash = Math.max(0, G.flash - dt * 3);
  G.comboShow = Math.max(0, G.comboShow - dt);
  G.hero.poseT = Math.max(0, G.hero.poseT - d); if (G.hero.poseT <= 0) G.hero.pose = 0;
  G.hero.glow = Math.max(0, G.hero.glow - d * 1.5); G.hero.hurt = Math.max(0, G.hero.hurt - d * 2);
  G.ai.lineT = Math.max(0, G.ai.lineT - dt); G.ai.hurtMove = Math.max(0, G.ai.hurtMove - d * 1.4);
  for (let i = 0; i < 3; i++) G.turretKick[i] = Math.max(0, G.turretKick[i] - d * 6);
  G.bannerT = Math.max(0, G.bannerT - dt); G.bossTaunt = Math.max(0, G.bossTaunt - dt); G.empT = Math.max(0, G.empT - dt);
  if (G.energy >= 100 && !G.ai.fullSaid && G.state === 'player') { G.ai.fullSaid = true; say(AI_LINES.full[0]); }

  G.phaseT += d;
  switch (G.state) {
    case 'intro': if (G.phaseT > 1.4) { G.state = 'player'; } break;
    case 'drag':
      if (G.swapped) { G.timer -= dt; if (G.timer <= 0) endDrag(); }
      break;
    case 'resolve': stepResolve(); break;
    case 'attack': stepAttack(); break;
    case 'enemy': stepEnemy(); break;
    case 'clear':
      if (G.phaseT > 1.0) {
        if (G.wave >= 3) { finish(true); }
        else { openCards(); }
      }
      break;
  }
}

// ── 轉珠操作 ──
function boardCellAt(x, y) {
  const c = Math.floor((x - BX) / CELL), r = Math.floor((y - BY) / CELL);
  return { c: clamp(c, 0, COLS - 1), r: clamp(r, 0, ROWS - 1), inside: x >= BX && x < BX + COLS * CELL && y >= BY && y < BY + ROWS * CELL };
}
function swapCells(a, b) {
  const t = G.board[a.r][a.c]; G.board[a.r][a.c] = G.board[b.r][b.c]; G.board[b.r][b.c] = t;
}
function beginDrag(x, y) {
  const cell = boardCellAt(x, y); if (!cell.inside) return false;
  G.held = { c: cell.c, r: cell.r }; G.dragX = x; G.dragY = y; G.swapped = false;
  G.timer = G.timeLimit + G.mods.time; G.state = 'drag'; G.combo = 0; G.groups = [];
  return true;
}
function moveDrag(x, y) {
  G.dragX = clamp(x, BX + 8, BX + COLS * CELL - 8); G.dragY = clamp(y, BY + 8, BY + ROWS * CELL - 8);
  let target = boardCellAt(G.dragX, G.dragY), guard = 0;
  while ((target.c !== G.held.c || target.r !== G.held.r) && guard++ < 12) {
    const step = { c: G.held.c + Math.sign(target.c - G.held.c), r: G.held.r + Math.sign(target.r - G.held.r) };
    swapCells(G.held, step); G.held = step;
    if (!G.swapped) { G.swapped = true; }
    SFX.swap();
  }
}
function endDrag() {
  if (G.state !== 'drag') return;
  const hp = G.board[G.held.r][G.held.c]; hp.s = 1.25;
  G.held = null;
  if (!G.swapped) { G.state = 'player'; return; }
  G.state = 'resolve'; G.phaseT = 0; G.queue = findGroups(G.board); G.subPhase = 'pop';
}
function stepResolve() {
  if (G.subPhase === 'pop') {
    if (G.phaseT < 0.2) return;
    if (G.queue.length) { popGroup(G.queue.shift()); G.phaseT = 0; return; }
    G.subPhase = 'fall'; G.phaseT = 0; gravity(); return;
  }
  if (G.subPhase === 'fall') {
    if (G.phaseT < 0.38) return;
    const more = findGroups(G.board);
    if (more.length) { G.queue = more; G.subPhase = 'pop'; G.phaseT = 0.1; return; }
    if (!G.groups.length) { G.state = 'enemy'; G.phaseT = 0; G.enemyIdx = 0; return; }
    G.state = 'attack'; G.phaseT = 0; G.attackIdx = 0;
    if (G.combo >= 3) say(pick(AI_LINES.combo));
  }
}
function popGroup(g) {
  G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo); G.comboShow = 1.3;
  const T = TYPES[g.t], hand = heroHand();
  let plusAt = null;
  if (g.cells.length >= G.mods.plus) { plusAt = g.cells[Math.floor(g.cells.length / 2)]; }
  for (const [c, r] of g.cells) {
    const p = cellPos(c, r);
    for (let i = 0; i < 7; i++) {

let cardRects = [], btnRect = null;

}

  ctx.font = '800 20px "Microsoft JhengHei",sans-serif'; ctx.fillStyle = '#c8fbff'; ctx.fillText('最高連擊', W / 2, 270);

  ctx.font = '900 30px "Arial Black",sans-serif'; ctx.fillStyle = CYAN; ctx.fillText('COMBO', W / 2, 460);

    ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.font = '900 20px "Microsoft JhengHei",sans-serif'; ctx.fillText(v, W - 110, y);

  ctx.fillStyle = '#00262c'; ctx.font = '900 24px "Microsoft JhengHei",sans-serif'; ctx.textAlign = 'center'; ctx.fillText('再玩一次', W / 2, btnRect.y + 33);
  ctx.font = '700 13px "Microsoft JhengHei",sans-serif'; ctx.fillStyle = '#6f8592'; ctx.fillText('零號廢域 試玩原型｜動嘴做遊戲', W / 2, 860);

  ctx.font = '700 15px "Microsoft JhengHei",sans-serif'; ctx.fillStyle = '#5f7380'; ctx.fillText('試玩原型｜一關戰鬥', W / 2, 450);

  ctx.fillStyle = CYAN; ctx.shadowColor = CYAN; ctx.shadowBlur = 24 * pulse; roundRect(btnRect.x, btnRect.y, btnRect.w, btnRect.h, 35); ctx.fill(); ctx.shadowBlur = 0;

  ['按住零件拖動，經過的零件會交換位置', '橫排或直排 3 個以上相同 → 合成攻擊', '敵人頭上的數字歸零就會攻擊房車'].forEach((s, i) => ctx.fillText(s, W / 2, 700 + i * 26));

function render() {

// ── 輸入（觸控＋滑鼠） ──
function toXY(ev) { const r = cv.getBoundingClientRect(); return { x: (ev.clientX - r.left) / SCALE, y: (ev.clientY - r.top) / SCALE }; }

let pid = null;

  ev.preventDefault(); audioInit(); const p = toXY(ev);
  if (G.state === 'title') { if (inRect(p, btnRect)) startGame(); return; }
  if (G.state === 'result') { if (inRect(p, btnRect)) startGame(); return; }
  if (G.state === 'cards') { cardRects.forEach((r, i) => { if (inRect(p, r)) chooseCard(i); }); return; }
  if (G.state === 'player') {
    if (G.ai.drawX && Math.hypot(p.x - G.ai.drawX, p.y - G.ai.drawY) < 48 && G.energy >= 100) { useEMP(); return; }

}, { passive: false });

const up = ev => { if (G.state === 'drag' && ev.pointerId === pid) { endDrag(); pid = null; } };

// ── 主迴圈 ──
let last = performance.now(), running = true;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (running) { update(dt); render(); }
  requestAnimationFrame(loop);
}
newGame(); requestAnimationFrame(loop);

// ═══════════════ 模擬試玩用介面（不影響遊戲） ═══════════════
window.__dev = {

  render() { render(); },
  findGroups,
  // 找一條轉珠路徑（隨機搜尋 tries 條，選連擊最多的），直接執行

};

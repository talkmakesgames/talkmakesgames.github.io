<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>薯懶懶人運動會｜動嘴做遊戲</title>
<style>
:root{--cream:#fff8ee;--brown:#3a1e0f;--tan:#a0663a;--red:#d9574e;--orange:#f28c28;--yellow:#ffd84d;--green:#4caf50;--purple:#a33a62}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#f7d29c;color:var(--brown);font-family:-apple-system,"PingFang TC","Noto Sans CJK TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
/* ---------- home ---------- */
#home{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.brand{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:800;color:var(--tan)}
.brand b{background:var(--brown);color:var(--cream);padding:4px 10px;border-radius:999px;font-size:12px}
.hero{position:relative;margin-top:10px;background:linear-gradient(180deg,#ffe9c7,#fff8ee);border:4px solid var(--brown);border-radius:24px;padding:16px 14px 12px;text-align:center;overflow:hidden}
.hero h1{margin:4px 0 0;font-size:36px;line-height:1.15;color:var(--red);text-shadow:3px 3px 0 #3a1e0f22;letter-spacing:1px}
.hero .season{display:inline-block;margin-top:6px;background:var(--orange);color:#fff;font-weight:900;font-size:13px;padding:3px 12px;border-radius:999px}
.hero .flags{position:absolute;top:0;left:0;right:0;height:16px;background:repeating-linear-gradient(90deg,var(--red) 0 22px,var(--yellow) 22px 44px,var(--green) 44px 66px,#3d8bfd 66px 88px);clip-path:polygon(0 0,100% 0,100% 40%,0 100%)}
.board{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0 6px}
.board .side{display:flex;flex-direction:column;align-items:center;width:110px}
.board img{height:84px;object-fit:contain}
.board .nm{font-weight:900;font-size:16px}
.board .num{font-size:52px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.board .vs{font-size:22px;font-weight:900;color:var(--tan)}
.board .colon{font-size:40px;font-weight:900}
.story{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;border:3px solid var(--brown);border-radius:18px;padding:10px;margin-top:8px}
.story img{width:74px;flex:none}
.story p{margin:0;font-size:14px;line-height:1.6}
.btnMain{display:block;width:100%;margin-top:12px;font-size:20px;font-weight:900;padding:14px;border:none;border-radius:999px;background:var(--red);color:#fff;box-shadow:0 5px 0 #8e2f28}
.btnMain:active{transform:translateY(4px);box-shadow:0 1px 0 #8e2f28}
h2{font-size:20px;margin:22px 4px 10px;display:flex;align-items:center;gap:8px}
h2 small{font-size:12px;color:var(--tan);font-weight:700}
.ev{display:flex;align-items:center;gap:12px;background:var(--cream);border:3px solid var(--brown);border-radius:18px;padding:10px 12px;margin-bottom:10px}
.ev .no{flex:none;width:40px;height:40px;border-radius:50%;background:var(--orange);color:#fff;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;border:3px solid var(--brown)}
.ev .info{flex:1;min-width:0}
.ev .t{font-weight:900;font-size:17px}
.ev .d{font-size:13px;color:#6b4a35;margin-top:2px}
.ev .st{font-size:12px;font-weight:800;margin-top:4px}
.ev button{flex:none;font-size:15px;font-weight:900;padding:9px 14px;border-radius:999px;border:3px solid var(--brown);background:var(--yellow);color:var(--brown)}
.ev.locked{opacity:.55;background:#f3e3cc}
.ev.locked .no{background:#b9a48c}
.ev.locked button{background:#e7d6bf}
.win{color:#2e7d32}.lose{color:var(--purple)}
.cast{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cast div{background:#fff;border:3px solid var(--brown);border-radius:18px;padding:8px;text-align:center}
.cast img{height:88px;max-width:100%;object-fit:contain}
.cast b{display:block;font-size:16px}
.cast span{font-size:12px;color:#6b4a35}
.foot{margin-top:24px;text-align:center;font-size:12px;color:var(--tan);line-height:1.8}
.foot a{color:var(--tan)}
.reset{background:none;border:none;color:var(--tan);text-decoration:underline;font-size:12px}
/* ---------- play ---------- */
#play{position:fixed;inset:0;background:#2a1d14;display:flex;flex-direction:column;align-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
#bar{width:100%;max-width:560px;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;color:var(--cream);font-weight:900}
#bar button{background:var(--cream);border:none;border-radius:999px;padding:7px 14px;font-weight:900;color:var(--brown)}
#bar .ttl{font-size:16px}
#bar .br{font-size:11px;opacity:.7}
#stage{flex:1;display:flex;align-items:flex-start;justify-content:center;width:100%}
#cv{display:block;border-radius:16px;touch-action:none}
/* ---------- dialog ---------- */
#dlg{position:fixed;inset:0;background:rgba(42,29,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
#dlgBox{position:relative;width:100%;max-width:560px;margin:0 10px 18px;background:var(--cream);border:4px solid var(--brown);border-radius:22px;padding:14px 16px 14px 132px;min-height:140px;animation:pop .2s}
#dlgImg{position:absolute;left:8px;bottom:8px;width:118px;max-height:150px;object-fit:contain;object-position:bottom}
#dlgName{display:inline-block;font-weight:900;font-size:14px;color:#fff;padding:2px 12px;border-radius:999px;margin-bottom:6px}
#dlgText{font-size:18px;font-weight:700;line-height:1.55;min-height:56px}
#dlgNext{position:absolute;right:14px;bottom:8px;font-size:12px;color:var(--tan);font-weight:800;animation:blink 1s infinite}
@keyframes pop{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
@keyframes blink{50%{opacity:.3}}
/* ---------- result ---------- */
#res{position:fixed;inset:0;background:rgba(42,29,20,.75);display:flex;align-items:center;justify-content:center;z-index:15;padding:14px}
#resBox{width:100%;max-width:420px;background:var(--cream);border:4px solid var(--brown);border-radius:24px;padding:16px;text-align:center;animation:pop .25s}
#resBox h3{margin:2px 0 4px;font-size:28px}
#resSub{font-size:15px;font-weight:700;color:#6b4a35}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:6px;margin:14px 0 6px;height:220px}
.pd{display:flex;flex-direction:column;align-items:center;width:46%}
.pd img{width:100%;max-height:130px;object-fit:contain;object-position:bottom}
.pd .blk{width:100%;border:3px solid var(--brown);border-bottom:none;border-radius:12px 12px 0 0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px;color:#fff}
.pd.first .blk{height:86px;background:var(--yellow);color:var(--brown)}
.pd.second .blk{height:52px;background:#c9b49a}
#resStats{font-size:14px;font-weight:800;margin:6px 0 2px}
#resBox .row{display:flex;gap:8px;margin-top:12px}
#resBox .row button{flex:1;font-size:17px;font-weight:900;padding:12px;border-radius:999px;border:3px solid var(--brown)}
#bAgain{background:var(--red);color:#fff}
#bHome{background:#fff;color:var(--brown)}
</style>
</head>

    <button class="reset" id="bReset">清除我的比賽紀錄</button>

</div>

  <div id="bar"><button id="bBack">← 會場</button><div style="text-align:center"><div class="ttl" id="barT"></div><div class="br">薯懶懶人運動會・動嘴做遊戲</div></div><div style="width:70px"></div></div>
  <div id="stage"><canvas id="cv"></canvas></div>
</div>

</div></div>

function bubble(x,y,text,size,flip){

  const bx=Math.max(6,Math.min(W-w-6,x-w/2)), by=y-h;
  ctx.fillStyle='#fff'; ctx.strokeStyle='#3a1e0f'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.roundRect?ctx.roundRect(bx,by,w,h,14):ctx.rect(bx,by,w,h); ctx.fill(); ctx.stroke();
  ctx.beginPath(); const tx=Math.max(bx+16,Math.min(bx+w-16,x)); ctx.moveTo(tx-8,by+h-1); ctx.lineTo(tx,by+h+12); ctx.lineTo(tx+8,by+h-1); ctx.fill();
  ctx.beginPath(); ctx.moveTo(tx-8,by+h); ctx.lineTo(tx,by+h+12); ctx.lineTo(tx+8,by+h); ctx.stroke();

function heart(x,y,s,on){

function burst(fx,x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*(sp||4);
  fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,life:22+Math.random()*16,col});}}
function drawFx(fx){for(const f of fx){ctx.globalAlpha=Math.min(1,f.life/14); ctx.fillStyle=f.col; ctx.fillRect(f.x-3,f.y-3,6,6);} ctx.globalAlpha=1;}
function stepFx(fx){for(const f of fx){f.x+=f.vx; f.y+=f.vy; f.vy+=0.2; f.life--;} return fx.filter(f=>f.life>0);}
function pill(x,y,w,h){ctx.beginPath(); ctx.roundRect?ctx.roundRect(x,y,w,h,h/2):ctx.rect(x,y,w,h);}

// ================= GAME 1: 沙發相撲 =================
function sumoGame(){
  const CX=270,CY=480,R=215;
  const g={type:'sumo',t:0,round:1,wins:{shu:0,qin:0},phase:'count',pt:150,fx:[],shake:0,joy:null,msg:null,msgT:0};
  function reset(){
    g.shu={x:CX-120,y:CY,vx:0,vy:0,m:1.35,r:44,face:'lazy',faceT:0,out:false};
    g.qin={x:CX+120,y:CY,vx:0,vy:0,m:1.0,r:40,face:'proud',faceT:0,out:false,dashT:90,boost:0};
    g.phase='count'; g.pt=150; g.fx=[];
  }
  reset();
  const lvl=()=>0.25+g.round*0.035;
  function setFace(o,f,t){o.face=f; o.faceT=t;}
  g.down=(x,y)=>{g.joy={ox:x,oy:y,x,y};};
  g.move=(x,y)=>{if(g.joy){g.joy.x=x; g.joy.y=y;}};
  g.up=()=>{g.joy=null;};
  g.step=()=>{
    g.t++; g.fx=stepFx(g.fx); g.shake*=0.86; if(g.msgT>0) g.msgT--;
    const s=g.shu,q=g.qin;
    [s,q].forEach(o=>{if(o.faceT>0&&--o.faceT===0) o.face=o===s?'lazy':'proud';});
    if(g.phase==='count'){ if(--g.pt<=0){g.phase='fight'; g.msg=['hua','開始！']; g.msgT=50;} }
    if(g.phase==='fight'){
      // player thrust
      let ax=0,ay=0;
      if(g.joy){let dx=g.joy.x-g.joy.ox,dy=g.joy.y-g.joy.oy,d=Math.hypot(dx,dy); if(d>8){ax=dx/d*Math.min(1,d/60); ay=dy/d*Math.min(1,d/60);}}
      if(keys.ArrowLeft||keys.a) ax-=1; if(keys.ArrowRight||keys.d) ax+=1; if(keys.ArrowUp||keys.w) ay-=1; if(keys.ArrowDown||keys.s) ay+=1;
      const al=Math.hypot(ax,ay); if(al>1){ax/=al; ay/=al;}
      s.vx+=ax*0.36; s.vy+=ay*0.36;
      // AI
      const toC={x:CX-q.x,y:CY-q.y}, dq=Math.hypot(toC.x,toC.y);
      const sd=Math.hypot(s.x-CX,s.y-CY)||1;
      let tx=s.x+(s.x-CX)/sd*30, ty=s.y+(s.y-CY)/sd*30;
      if(dq>R*0.72){const w=(dq-R*0.72)/(R*0.28); tx=tx*(1-w)+CX*w; ty=ty*(1-w)+CY*w;}
      let dx=tx-q.x,dy=ty-q.y,d=Math.hypot(dx,dy)||1;
      const jitter=Math.sin(g.t*0.05)*0.35;
      const ux=dx/d*Math.cos(jitter)-dy/d*Math.sin(jitter), uy=dx/d*Math.sin(jitter)+dy/d*Math.cos(jitter);
      if(--q.dashT<=0){q.boost=14; q.dashT=110+Math.random()*80-g.round*15; setFace(q,'angry',40); g.msg=['qin',['看我的衝刺！','動起來！','深蹲的力量！'][Math.floor(Math.random()*3)]]; g.msgT=50;}
      const acc=lvl()*(q.boost>0?2.6:1); if(q.boost>0) q.boost--;
      q.vx+=ux*acc; q.vy+=uy*acc;
    }
    // integrate
    [s,q].forEach(o=>{o.vx*=0.935; o.vy*=0.935; o.x+=o.vx; o.y+=o.vy;});
    // collide
    let dx=q.x-s.x,dy=q.y-s.y,d=Math.hypot(dx,dy),min=s.r+q.r;
    if(d<min&&d>0){
      const nx=dx/d,ny=dy/d,pen=min-d,im=1/s.m+1/q.m;
      s.x-=nx*pen/s.m/im; s.y-=ny*pen/s.m/im; q.x+=nx*pen/q.m/im; q.y+=ny*pen/q.m/im;
      const rv=(q.vx-s.vx)*nx+(q.vy-s.vy)*ny;
      if(rv<0){const j=-1.7*rv/im; s.vx-=nx*j/s.m; s.vy-=ny*j/s.m; q.vx+=nx*j/q.m; q.vy+=ny*j/q.m;
        if(-rv>2){burst(g.fx,s.x+nx*s.r,s.y+ny*s.r-30,'#ffd84d',Math.min(22,Math.round(-rv*4)),-rv); g.shake=Math.min(14,-rv*2.5);
          const sp=Math.hypot(s.vx,s.vy),qp=Math.hypot(q.vx,q.vy);
          if(sp<qp){setFace(q,'shock',30); setFace(s,'smug',30);} else {setFace(s,'shock',30); setFace(q,'angry',30);}}}
    }
    if(g.phase==='fight'){
      const so=Math.hypot(s.x-CX,s.y-CY)>R+6, qo=Math.hypot(q.x-CX,q.y-CY)>R+6;
      if(so||qo){
        g.phase='end'; g.pt=120;
        const w=qo&&!so?'shu':so&&!qo?'qin':(Math.hypot(s.x-CX,s.y-CY)<Math.hypot(q.x-CX,q.y-CY)?'shu':'qin');
        g.wins[w]++; g.lastW=w;
        if(w==='shu'){setFace(s,'smug',200); setFace(q,'sad',200); g.msg=['pian','薯懶大大贏了！'];}
        else {setFace(s,'crash',200); setFace(q,'proud',200); g.msg=['qin','太弱了吧！'];}
        g.msgT=110;
      }
    } else if(g.phase==='end'){
      if(--g.pt<=0){
        if(g.wins.shu>=2||g.wins.qin>=2){ if(!g.over) finish(g.wins.shu>=2,g.wins.shu+':'+g.wins.qin,'沙發相撲 '+g.wins.shu+' : '+g.wins.qin); g.phase='done'; }
        else {g.round++; reset();}
      }
    }
  };
  g.draw=()=>{
    const s=g.shu,q=g.qin;
    // stadium background
    const bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#bfe3ff'); bg.addColorStop(0.28,'#e8f6ff'); bg.addColorStop(0.3,'#8fd16a'); bg.addColorStop(1,'#5fae45');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    // bunting
    for(let i=0;i<14;i++){ctx.fillStyle=['#d9574e','#ffd84d','#4caf50','#3d8bfd'][i%4]; ctx.beginPath(); ctx.moveTo(i*42,0); ctx.lineTo(i*42+42,0); ctx.lineTo(i*42+21,26); ctx.fill();}
    // ring
    ctx.save(); if(g.shake>0.5) ctx.translate((Math.random()-.5)*g.shake,(Math.random()-.5)*g.shake);
    ctx.fillStyle='rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(CX,CY+14,R+22,R*0.62+22,0,0,7); ctx.fill();
    ctx.fillStyle='#e9d6b0'; ctx.beginPath(); ctx.ellipse(CX,CY,R+18,R*0.62+18,0,0,7); ctx.fill();
    ctx.fillStyle='#d9b77e'; ctx.beginPath(); ctx.ellipse(CX,CY,R,R*0.62,0,0,7); ctx.fill();
    ctx.strokeStyle='#fff8ee'; ctx.lineWidth=6; ctx.beginPath(); ctx.ellipse(CX,CY,R,R*0.62,0,0,7); ctx.stroke();
    ctx.strokeStyle='rgba(58,30,15,.25)'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(CX-60,CY-24); ctx.lineTo(CX-60,CY+24); ctx.moveTo(CX+60,CY-24); ctx.lineTo(CX+60,CY+24); ctx.stroke();
    // fighters (ring drawn squashed: y scaled .62)
    const P=o=>({x:o.x,y:CY+(o.y-CY)*0.62});
    const list=[[s,'shu',185],[q,'qin',135]].sort((a,b)=>a[0].y-b[0].y);
    for(const [o,k,w] of list){
      const p=P(o), out=Math.hypot(o.x-CX,o.y-CY)>R;
      ctx.fillStyle='rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(p.x,p.y,o.r*1.15,o.r*0.45,0,0,7); ctx.fill();
      const bob=g.phase==='fight'?Math.sin(g.t*0.25+(k==='qin'?1:0))*2:0;
      sprite(k+'_'+o.face,p.x,p.y+12+bob,w,{alpha:out?0.6:1});
      ctx.font='900 18px '+FONT; ctx.textAlign='center'; ctx.fillStyle=k==='shu'?'#c25e00':'#7a1f45'; ctx.fillText(CH[k].n,p.x,p.y+34);
    }
    ctx.restore();
    drawFx(g.fx);
    // referee
    sprite('hua_lecture',90,250,120);
    if(g.phase==='count'){const n=Math.ceil(g.pt/50); bubble(150,150,'第 '+g.round+' 回合！',24); bigText(n>0?String(n):'',CY-40,'#ffd84d',110);}
    // cheerleader
    const scared=Math.hypot(s.x-CX,s.y-CY)>R*0.75&&g.phase==='fight';
    const pf=g.phase==='end'&&g.lastW==='shu'?'adore':scared?'scared':'happy';
    sprite('pian_'+pf,460,880+Math.abs(Math.sin(g.t*0.15))*-14,120);
    ctx.save(); ctx.translate(470,760); ctx.rotate(-0.12+Math.sin(g.t*0.15)*0.08);
    ctx.fillStyle='#ff7aa8'; ctx.strokeStyle='#3a1e0f'; ctx.lineWidth=3; pill(-70,-22,140,44); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='900 20px '+FONT; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('薯懶加油！',0,1); ctx.restore();
    // HUD
    ctx.fillStyle='rgba(255,248,238,.92)'; pill(150,40,240,56); ctx.fill(); ctx.strokeStyle='#3a1e0f'; ctx.lineWidth=3; ctx.stroke();
    ctx.font='900 20px '+FONT; ctx.textBaseline='middle'; ctx.textAlign='left'; ctx.fillStyle='#c25e00'; ctx.fillText('薯懶',166,68);
    ctx.textAlign='right'; ctx.fillStyle='#7a1f45'; ctx.fillText('勤薯',374,68);
    for(let i=0;i<2;i++){ctx.fillStyle=i<g.wins.shu?'#f28c28':'rgba(58,30,15,.15)'; ctx.beginPath(); ctx.arc(228+i*22,68,8,0,7); ctx.fill();
      ctx.fillStyle=i<g.wins.qin?'#a33a62':'rgba(58,30,15,.15)'; ctx.beginPath(); ctx.arc(312-i*22,68,8,0,7); ctx.fill();}
    if(g.msgT>0&&g.msg){
      const [who,text]=g.msg;
      if(who==='hua') bubble(150,150,text,26);
      else if(who==='pian') bubble(400,700,text,22);
      else {const p=P(q); bubble(p.x,p.y-120,text,22);}
    }
    if(g.phase==='end') bigText(g.lastW==='shu'?'薯懶拿下這回合！':'勤薯拿下這回合…',CY-200,g.lastW==='shu'?'#ffd84d':'#ff9ac0',40);
    // joystick
    if(g.joy){ctx.globalAlpha=0.5; ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(g.joy.ox,g.joy.oy,60,0,7); ctx.stroke();
      let dx=g.joy.x-g.joy.ox,dy=g.joy.y-g.joy.oy,d=Math.hypot(dx,dy),k=d>60?60/d:1; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(g.joy.ox+dx*k,g.joy.oy+dy*k,26,0,7); ctx.fill(); ctx.globalAlpha=1;}
    else if(g.phase==='fight'&&g.t<400){ctx.font='800 20px '+FONT; ctx.textAlign='center'; ctx.fillStyle='rgba(58,30,15,.7)'; ctx.fillText('按住螢幕往想去的方向拖曳',W/2-60,H-40);}
  };
  return g;
}

// ================= GAME 2: 補給站大胃王 =================
function chipsGame(){
  const PW=250, GOAL=25, TIME=45;
  const g={type:'chips',t:0,score:0,hearts:3,px:W/2,tx:W/2,items:[],fx:[],texts:[],spawnT:0,face:'idle',faceT:0,shake:0,tilt:0,
           hx:W/2,hdir:1,hface:'lecture',hfaceT:0,hmsg:null,hmsgT:0,throwT:150,phase:'play',pianT:0,pianFace:'happy'};
  const MOUTH_Y=H-30-PW*329/508*(1-0.39);

  g.down=(x)=>{g.tx=x;}; g.move=(x,y,b)=>{if(b) g.tx=x;}; g.up=()=>{};
  g.step=()=>{
    if(g.phase!=='play'){g.fx=stepFx(g.fx); for(const t of g.texts){t.y-=1;t.life--;} g.texts=g.texts.filter(t=>t.life>0); return;}
    g.t++;
    const el=g.t/60;
    if(keys.ArrowLeft||keys.a) g.tx=g.px-40; if(keys.ArrowRight||keys.d) g.tx=g.px+40;
    const pv=g.px; g.px+=(g.tx-g.px)*0.28; g.px=Math.max(PW*0.35,Math.min(W-PW*0.35,g.px)); g.tilt+=((g.px-pv)*0.012-g.tilt)*0.2;
    if(g.faceT>0&&--g.faceT===0) g.face='idle';
    if(g.hfaceT>0&&--g.hfaceT===0) g.hface='lecture';
    if(g.hmsgT>0) g.hmsgT--; if(g.pianT>0&&--g.pianT===0) g.pianFace='happy';
    // broccoli boss walks and throws
    g.hx+=g.hdir*(1.6+el*0.05); if(g.hx<80){g.hx=80;g.hdir=1;} if(g.hx>W-80){g.hx=W-80;g.hdir=-1;} if(Math.random()<0.006) g.hdir*=-1;
    if(--g.throwT<=0){
      g.throwT=Math.max(30,95-el*1.4)*(0.7+Math.random()*0.6);
      g.items.push({type:Math.random()<.5?'broc':'carrot',x:g.hx,y:200,vx:(Math.random()-.5)*2.5,vy:-2-Math.random()*2,g:0.18+el*0.003,rot:0,vr:(Math.random()-.5)*0.15});
      g.hface='chase'; g.hfaceT=20;
      if(Math.random()<0.25){g.hmsg=['多吃蔬菜！','快去運動！','少吃垃圾食物！','花椰菜最營養！'][Math.floor(Math.random()*4)]; g.hmsgT=70;}
    }
    // chips from the sky
    g.spawnT+=1000/60;
    if(g.spawnT>=Math.max(330,620-el*7)){g.spawnT=0;
      const r=Math.random(), type=r<0.06?'bag':r<0.10?'pian':'chip';
      g.items.push({type,x:40+Math.random()*(W-80),y:-30,vx:0,vy:3.6+el*0.07+Math.random()*1.2,g:0,rot:Math.random()*6,vr:(Math.random()-.5)*0.1});}
    for(const it of g.items){
      const py=it.y; it.vy+=it.g; it.x+=it.vx; it.y+=it.vy; it.rot+=it.vr;
      if(it.x<20||it.x>W-20) it.vx*=-1;
      if(!it.done&&py<MOUTH_Y&&it.y>=MOUTH_Y&&Math.abs(it.x-g.px)<50){
        it.done=true;
        if(it.type==='chip'){g.score++; setFace('chew',22); burst(g.fx,it.x,MOUTH_Y,'#ffd84d',8); pop(it.x,MOUTH_Y-50,'+1','#d9574e');}
        else if(it.type==='bag'){g.score+=3; setFace('thumb',50); burst(g.fx,it.x,MOUTH_Y,'#ff9a3c',16); pop(it.x,MOUTH_Y-50,'+3 薯懶牌！','#ff8a00');}
        else if(it.type==='pian'){g.hearts=Math.min(3,g.hearts+1); setFace('chew',30); g.pianFace='hurt'; g.pianT=120; burst(g.fx,it.x,MOUTH_Y,'#ffe680',12); pop(it.x,MOUTH_Y-50,'片片：啊！我的角！','#e0a800');}
        else {g.hearts--; setFace('crash',50); g.shake=14; g.hface='smug'; g.hfaceT=60; g.hmsg='哈！吃到蔬菜了吧！'; g.hmsgT=70; burst(g.fx,it.x,MOUTH_Y,'#4caf50',14); pop(it.x,MOUTH_Y-50,'噁！蔬菜','#2e7d32');}
        if(g.score>=GOAL&&g.phase==='play'){g.phase='done'; setFace('thumb',999); g.hface='angry'; g.hfaceT=999; pop(W/2,H*0.45,'吃到 '+GOAL+' 片了！','#ff8a00'); finish(true,g.score+' 片','大胃王 '+g.score+' 片／剩 '+Math.max(0,TIME-el).toFixed(0)+' 秒');}
        else if(g.hearts<=0&&g.phase==='play'){g.phase='done'; g.hface='smug'; g.hfaceT=999; finish(false,g.score+' 片','大胃王 '+g.score+' 片（心用完了）');}
      }
    }
    if(g.phase==='play'&&el>=TIME){g.phase='done'; g.hface='smug'; g.hfaceT=999; setFace('crash',999); finish(false,g.score+' 片','大胃王 '+g.score+' 片（時間到）');}
    g.items=g.items.filter(it=>!it.done&&it.y<H+50);
    g.fx=stepFx(g.fx); for(const t of g.texts){t.y-=1.2;t.life--;} g.texts=g.texts.filter(t=>t.life>0); g.shake*=0.85;
  };
  function chip(x,y,r,rot){ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.beginPath();
    for(let i=0;i<=24;i++){const a=i/24*Math.PI*2, rr=r*(1+0.08*Math.sin(a*5)); ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr*0.78);}
    ctx.closePath(); ctx.fillStyle='#ffd84d'; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle='#c98a1d'; ctx.stroke();
    ctx.fillStyle='#e9a92c'; [[-6,-4],[7,3],[-2,7],[5,-7]].forEach(([a,b])=>{ctx.beginPath(); ctx.arc(a*r/22,b*r/22,2.2,0,7); ctx.fill();}); ctx.restore();}
  function broc(x,y,rot){ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.fillStyle='#8bc34a'; ctx.strokeStyle='#33691e'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(-7,4); ctx.lineTo(-9,26); ctx.lineTo(9,26); ctx.lineTo(7,4); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.fillStyle='#43a047';
    [[-13,-2,12],[0,-10,14],[13,-2,12],[0,4,11]].forEach(([a,b,r])=>{ctx.beginPath(); ctx.arc(a,b,r,0,7); ctx.fill(); ctx.stroke();}); ctx.restore();}
  function carrot(x,y,rot){ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.fillStyle='#4caf50'; ctx.strokeStyle='#2e7d32'; ctx.lineWidth=3;
    [[-6,-30],[0,-34],[6,-30]].forEach(([a,b])=>{ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(a,b); ctx.lineTo(a*0.3,-14); ctx.fill(); ctx.stroke();});
    ctx.fillStyle='#ff8a3d'; ctx.strokeStyle='#c2571a'; ctx.beginPath(); ctx.moveTo(-11,-14); ctx.lineTo(11,-14); ctx.lineTo(0,30); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();}
  function bag(x,y,rot){ctx.save(); ctx.translate(x,y); ctx.rotate(Math.sin(rot)*0.25); ctx.fillStyle='#f28c28'; ctx.strokeStyle='#7a3b10'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(-24,-30); ctx.lineTo(24,-30); ctx.lineTo(28,30); ctx.lineTo(-28,30); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#ffd84d'; ctx.beginPath(); ctx.ellipse(0,-30,20,8,0,0,7); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#7a3b10'; ctx.font='900 17px '+FONT; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('薯懶',0,-8);
    ctx.fillStyle='#f6c26b'; ctx.beginPath(); ctx.arc(0,14,9,0,7); ctx.fill(); ctx.stroke(); ctx.restore();}
  g.draw=()=>{
    const bgr=ctx.createLinearGradient(0,0,0,H); bgr.addColorStop(0,'#bfe3ff'); bgr.addColorStop(0.3,'#e8f6ff'); bgr.addColorStop(0.31,'#8fd16a'); bgr.addColorStop(1,'#5fae45');
    ctx.fillStyle=bgr; ctx.fillRect(0,0,W,H);
    for(let i=0;i<14;i++){ctx.fillStyle=['#d9574e','#ffd84d','#4caf50','#3d8bfd'][i%4]; ctx.beginPath(); ctx.moveTo(i*42,0); ctx.lineTo(i*42+42,0); ctx.lineTo(i*42+21,26); ctx.fill();}
    // supply-station tent
    ctx.fillStyle='#fff8ee'; ctx.fillRect(20,H-130,W-40,100); ctx.fillStyle='#d9574e'; ctx.fillRect(20,H-150,W-40,24);
    ctx.fillStyle='#fff'; ctx.font='900 18px '+FONT; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('補給站',W/2,H-138);
    // platform for boss
    ctx.fillStyle='#a0663a'; ctx.fillRect(0,206,W,10);
    ctx.save(); if(g.shake>0.5) ctx.translate((Math.random()-.5)*g.shake,(Math.random()-.5)*g.shake);
    sprite('hua_'+g.hface,g.hx,210,118,{sx:g.hdir<0?-1:1});
    if(g.hmsgT>0&&g.hmsg) bubble(g.hx,108,g.hmsg,20);
    // player
    const k='shu_'+g.face, w=PW*(g.face==='crash'?1.05:1);
    const sq=g.face==='chew'?1+0.04*Math.sin(g.t*0.9):1;
    ctx.save(); ctx.translate(g.px,H-30); ctx.rotate(g.tilt); ctx.fillStyle='rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(0,0,w*0.42,12,0,0,7); ctx.fill(); ctx.restore();
    sprite(k,g.px,H-30,w,{rot:g.tilt,sx:1/sq,sy:sq});
    for(const it of g.items){
      if(it.type==='chip') chip(it.x,it.y,22,it.rot);
      else if(it.type==='bag') bag(it.x,it.y,it.rot);
      else if(it.type==='broc') broc(it.x,it.y,it.rot);
      else if(it.type==='carrot') carrot(it.x,it.y,it.rot);
      else sprite('pian_scared',it.x,it.y+30,70);
    }
    ctx.restore();
    drawFx(g.fx);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(const t of g.texts){ctx.globalAlpha=Math.min(1,t.life/20); ctx.font='900 30px '+FONT; ctx.lineWidth=6; ctx.strokeStyle='#fff'; ctx.strokeText(t.text,t.x,t.y); ctx.fillStyle=t.col; ctx.fillText(t.text,t.x,t.y);} ctx.globalAlpha=1;
    // cheerleader at side
    sprite('pian_'+g.pianFace,W-50,H-150-Math.abs(Math.sin(g.t*0.15))*10,80);
    // HUD
    ctx.fillStyle='rgba(255,248,238,.94)'; pill(14,36,W-28,58); ctx.fill(); ctx.strokeStyle='#3a1e0f'; ctx.lineWidth=3; ctx.stroke();
    chip(46,65,15,0.3); ctx.fillStyle='#3a1e0f'; ctx.font='900 30px '+FONT; ctx.textAlign='left'; ctx.fillText(g.score+' / '+GOAL,70,66);
    const left=Math.max(0,TIME-g.t/60); ctx.textAlign='center'; ctx.font='900 26px '+FONT; ctx.fillStyle=left<10?'#d9574e':'#3a1e0f'; ctx.fillText('⏱ '+left.toFixed(0),W/2+40,66);
    for(let i=0;i<3;i++) heart(W-110+i*36,66,1.3,i<g.hearts);
    ctx.fillStyle='rgba(58,30,15,.15)'; ctx.fillRect(14,98,W-28,8); ctx.fillStyle='#f28c28'; ctx.fillRect(14,98,(W-28)*Math.min(1,g.score/GOAL),8);
    if(g.t<240){ctx.font='800 20px '+FONT; ctx.fillStyle='rgba(58,30,15,.75)'; ctx.fillText('左右拖曳，張嘴接洋芋片！',W/2,H*0.45);}
  };
  return g;
}
const GAMES={sumo:sumoGame,chips:chipsGame};

// ---------- loop & input ----------
const keys={};
window.addEventListener('keydown',e=>{keys[e.key]=true;}); window.addEventListener('keyup',e=>{keys[e.key]=false;});
function toG(e){const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H];}
let pressed=false;
cv.addEventListener('pointerdown',e=>{pressed=true; try{cv.setPointerCapture(e.pointerId);}catch(_){} if(G&&G.down) G.down(...toG(e));});
cv.addEventListener('pointermove',e=>{if(G&&G.move) G.move(...toG(e),pressed||e.pointerType==='mouse');});
const up=()=>{pressed=false; if(G&&G.up) G.up();}; cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
document.addEventListener('visibilitychange',()=>{paused=document.hidden;});
let last=performance.now(),acc=0;
function loop(now){
  let dt=now-last; last=now; if(dt>100) dt=100;
  const blocked=!$('dlg').classList.contains('hidden');
  if(G&&!paused&&!blocked){acc+=dt; while(acc>=1000/60){G.step(); acc-=1000/60;}} else acc=0;
  if(G){ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0); G.draw();}
  requestAnimationFrame(loop);
}
window.__site={G:()=>G,P:()=>P,enter:id=>enter(EVENTS.find(e=>e.id===id))};
renderHome(); requestAnimationFrame(loop);
})();

const sfx=(()=>{let ac=null,on=true;try{on=localStorage.getItem('tmg-sound')!=='off';}catch(e){}
 function init(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(ac&&ac.state==='suspended')ac.resume();}
 function tone(f,d,type,vol,f2,delay){if(!on||!ac)return;const t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(vol||0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+0.02);}
 function noise(d,freq,vol,delay){if(!on||!ac)return;const t=ac.currentTime+(delay||0),n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),c=b.getChannelData(0);
  for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=b;f.type='bandpass';f.frequency.value=freq;f.Q.value=1.2;g.gain.value=vol||0.4;s.connect(f).connect(g).connect(ac.destination);s.start(t);}
 return {init,get on(){return on;},toggle(){on=!on;try{localStorage.setItem('tmg-sound',on?'on':'off');}catch(e){}init();return on;},
  crunch(){noise(0.07,2600,0.5);noise(0.06,1800,0.35,0.07);},

  over(){[523,440,349,262].forEach((f,i)=>tone(f,0.22,'triangle',0.16,0,i*0.16));},
  hit(p){const v=Math.min(0.5,0.12+p*0.08);tone(140,0.18,'sine',v,55);noise(0.08,900,v);},

const W=540,H=900,FONT='"PingFang TC","Noto Sans CJK TC","Noto Sans TC","Microsoft JhengHei",sans-serif';
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const img={}; for(const k in SPR){img[k]=new Image(); img[k].src=SPR[k];}
document.getElementById('startImg').src=SPR.idle;
let scale=1,dpr=1;
function fit(){
  const vw=window.innerWidth,vh=window.innerHeight; scale=Math.min(vw/W,vh/H)*0.98;
  dpr=window.devicePixelRatio||1;
  cv.style.width=W*scale+'px'; cv.style.height=H*scale+'px';
  cv.width=Math.round(W*scale*dpr); cv.height=Math.round(H*scale*dpr);
  for(const id of ['start','over']){const o=document.getElementById(id); o.style.width=W*scale+'px'; o.style.height=H*scale+'px';}
}
window.addEventListener('resize',fit); fit();

const PW=270, PH=PW*329/508, MOUTH_Y=H-30-PH+PH*0.39, CATCH=48;
let G=null, best=0;
try{best=+localStorage.getItem('shulan-best')||0;}catch(e){}

function newGame(){
  G={state:'play',t:0,score:0,hearts:3,combo:0,px:W/2,tx:W/2,items:[],fx:[],texts:[],spawnT:0,face:'idle',faceT:0,shake:0,tilt:0};
}
function setFace(f,ticks){G.face=f; G.faceT=ticks;}

function spawn(){
  const t=G.t/60, vegP=Math.min(0.42,0.2+t*0.005), r=Math.random();
  let type=r<vegP?(Math.random()<.5?'broc':'carrot'):(r<vegP+0.07?'bag':'chip');
  const vy=Math.min(9.5,3+t*0.07)*(0.85+Math.random()*0.3);
  G.items.push({type,x:40+Math.random()*(W-80),y:-40,vy,rot:Math.random()*6,vr:(Math.random()-.5)*0.12});
}

function burst(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*4;
  G.fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:25+Math.random()*15,col});}}
function pop(x,y,text,col){G.texts.push({x,y,text,col,life:50});}

function step(){
  if(G.state!=='play') return;
  G.t++;
  const ms=Math.max(330,900-(G.t/60)*13);
  G.spawnT+=1000/60; if(G.spawnT>=ms){G.spawnT=0; spawn();}
  const prevX=G.px; G.px+=(G.tx-G.px)*0.28; G.px=Math.max(PW*0.35,Math.min(W-PW*0.35,G.px));
  G.tilt+=((G.px-prevX)*0.012-G.tilt)*0.2;
  if(G.faceT>0&&--G.faceT===0) G.face='idle';
  for(const it of G.items){
    const py=it.y; it.y+=it.vy; it.rot+=it.vr;
    if(!it.done&&py<MOUTH_Y&&it.y>=MOUTH_Y&&Math.abs(it.x-G.px)<CATCH){
      it.done=true;
      if(it.type==='chip'){sfx.crunch(); G.score++; G.combo++; setFace('chew',22); burst(it.x,MOUTH_Y,'#ffd84d',8); pop(it.x,MOUTH_Y-40,'+1','#d9574e');
        if(G.combo%10===0){sfx.combo(); pop(W/2,H*0.4,'連吃 '+G.combo+' 片！','#ff8a00'); setFace('smug',50);}}
      else if(it.type==='bag'){sfx.bonus(); G.score+=5; G.combo++; setFace('smug',50); burst(it.x,MOUTH_Y,'#ff9a3c',18); pop(it.x,MOUTH_Y-40,'+5 薯懶牌！','#ff8a00');}
      else {sfx.bad(); G.hearts--; G.combo=0; setFace('crash',50); G.shake=14; burst(it.x,MOUTH_Y,'#4caf50',14); pop(it.x,MOUTH_Y-40,'噁！蔬菜','#2e7d32');
        if(G.hearts<=0){G.state='dying'; setTimeout(gameOver,900);}}
    }
  }
  G.items=G.items.filter(it=>!it.done&&it.y<H+50);
  for(const f of G.fx){f.x+=f.vx; f.y+=f.vy; f.vy+=0.25; f.life--;}
  G.fx=G.fx.filter(f=>f.life>0);
  for(const t of G.texts){t.y-=1.2; t.life--;}
  G.texts=G.texts.filter(t=>t.life>0);
  G.shake*=0.85;
}

// ---------- drawing ----------
function drawBg(){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#ffe9c7'); g.addColorStop(0.75,'#f7d29c'); g.addColorStop(1,'#e8b878');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.35)';
  for(let i=0;i<6;i++){ctx.fillRect(0,120+i*130,W,2);}
  // window
  ctx.fillStyle='#bfe3ff'; ctx.fillRect(330,110,160,130); ctx.strokeStyle='#a0663a'; ctx.lineWidth=8; ctx.strokeRect(330,110,160,130);
  ctx.beginPath(); ctx.moveTo(410,110); ctx.lineTo(410,240); ctx.moveTo(330,175); ctx.lineTo(490,175); ctx.stroke();
  // frame on wall
  ctx.fillStyle='#fff8ee'; ctx.fillRect(60,130,110,80); ctx.strokeStyle='#d9574e'; ctx.lineWidth=6; ctx.strokeRect(60,130,110,80);
  ctx.fillStyle='#d9574e'; ctx.font='800 26px '+FONT; ctx.textAlign='center'; ctx.fillText('薯懶',115,180);
  // floor
  ctx.fillStyle='#c98b55'; ctx.fillRect(0,H-70,W,70); ctx.fillStyle='#b97a46';
  for(let x=0;x<W;x+=90) ctx.fillRect(x,H-70,3,70);
}
function chip(x,y,r,rot){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
  ctx.beginPath();
  for(let i=0;i<=24;i++){const a=i/24*Math.PI*2, rr=r*(1+0.08*Math.sin(a*5)); ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr*0.78);}
  ctx.closePath(); ctx.fillStyle='#ffd84d'; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle='#c98a1d'; ctx.stroke();
  ctx.fillStyle='#e9a92c'; [[-6,-4],[7,3],[-2,7],[5,-7]].forEach(([a,b])=>{ctx.beginPath(); ctx.arc(a*r/22,b*r/22,2.2,0,7); ctx.fill();});
  ctx.restore();
}
function broc(x,y,rot){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot*0.3);
  ctx.fillStyle='#8bc34a'; ctx.strokeStyle='#33691e'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(-7,4); ctx.lineTo(-9,26); ctx.lineTo(9,26); ctx.lineTo(7,4); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#43a047';
  [[-13,-2,12],[0,-10,14],[13,-2,12],[0,4,11]].forEach(([a,b,r])=>{ctx.beginPath(); ctx.arc(a,b,r,0,7); ctx.fill(); ctx.stroke();});
  ctx.restore();
}
function carrot(x,y,rot){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
  ctx.fillStyle='#4caf50'; ctx.strokeStyle='#2e7d32'; ctx.lineWidth=3;
  [[-6,-30],[0,-34],[6,-30]].forEach(([a,b])=>{ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(a,b); ctx.lineTo(a*0.3,-14); ctx.fill(); ctx.stroke();});
  ctx.fillStyle='#ff8a3d'; ctx.strokeStyle='#c2571a';
  ctx.beginPath(); ctx.moveTo(-11,-14); ctx.lineTo(11,-14); ctx.lineTo(0,30); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-5,-2); ctx.lineTo(1,-2); ctx.moveTo(-1,10); ctx.lineTo(4,10); ctx.stroke();
  ctx.restore();
}
function bag(x,y,rot){
  ctx.save(); ctx.translate(x,y); ctx.rotate(Math.sin(rot)*0.25);
  ctx.fillStyle='#f28c28'; ctx.strokeStyle='#7a3b10'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(-24,-30); ctx.lineTo(24,-30); ctx.lineTo(28,30); ctx.lineTo(-28,30); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#ffd84d'; ctx.beginPath(); ctx.ellipse(0,-30,20,8,0,0,7); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#7a3b10'; ctx.font='900 17px '+FONT; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('薯懶',0,-8);
  ctx.fillStyle='#f6c26b'; ctx.beginPath(); ctx.arc(0,14,9,0,7); ctx.fill(); ctx.stroke();
  ctx.restore();
  ctx.save(); ctx.globalAlpha=0.6+0.4*Math.sin(G.t*0.3); ctx.fillStyle='#fff6a8';
  ctx.font='900 22px '+FONT; ctx.textAlign='center'; ctx.fillText('✦',x+30,y-30); ctx.restore();
}
function heart(x,y,s,on){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.beginPath();
  ctx.moveTo(0,6); ctx.bezierCurveTo(-14,-6,-8,-18,0,-10); ctx.bezierCurveTo(8,-18,14,-6,0,6); ctx.closePath();
  ctx.fillStyle=on?'#e53935':'rgba(58,30,15,.18)'; ctx.fill(); ctx.lineWidth=1.6; ctx.strokeStyle=on?'#8e1c1a':'rgba(58,30,15,.3)'; ctx.stroke(); ctx.restore();
}
function drawPlayer(){
  const im=img[G.face]||img.idle; if(!im.complete) return;
  const bob=G.face==='idle'?Math.sin(G.t*0.1)*2:0;
  const sq=G.face==='chew'?1+0.04*Math.sin(G.t*0.9):1;
  const w=PW, h=w*im.height/im.width;
  ctx.save(); ctx.translate(G.px,H-30+bob); ctx.rotate(G.tilt); ctx.scale(1/sq,sq);
  ctx.fillStyle='rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(0,0,w*0.42,12,0,0,7); ctx.fill();
  ctx.drawImage(im,-w/2,-h,w,h); ctx.restore();
}
function draw(){
  const s=scale*dpr; ctx.setTransform(s,0,0,s,0,0);
  if(G&&G.shake>0.5) ctx.translate((Math.random()-.5)*G.shake,(Math.random()-.5)*G.shake);
  drawBg();
  if(!G){return;}
  drawPlayer();
  for(const it of G.items){
    if(it.type==='chip') chip(it.x,it.y,22,it.rot);
    else if(it.type==='bag') bag(it.x,it.y,it.rot);
    else if(it.type==='broc') broc(it.x,it.y,it.rot);
    else carrot(it.x,it.y,it.rot);
  }
  for(const f of G.fx){ctx.globalAlpha=Math.min(1,f.life/15); ctx.fillStyle=f.col; ctx.fillRect(f.x-3,f.y-3,6,6);}
  ctx.globalAlpha=1;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const t of G.texts){ctx.globalAlpha=Math.min(1,t.life/20); ctx.font='900 34px '+FONT;
    ctx.lineWidth=6; ctx.strokeStyle='#fff'; ctx.strokeText(t.text,t.x,t.y); ctx.fillStyle=t.col; ctx.fillText(t.text,t.x,t.y);}
  ctx.globalAlpha=1;
  // HUD
  ctx.fillStyle='rgba(255,248,238,.85)'; ctx.beginPath(); ctx.roundRect?ctx.roundRect(16,16,190,64,20):ctx.rect(16,16,190,64); ctx.fill();
  chip(48,48,16,0.3);
  ctx.fillStyle='#3a1e0f'; ctx.font='900 38px '+FONT; ctx.textAlign='left'; ctx.fillText(G.score,76,50);
  for(let i=0;i<3;i++) heart(W-110+i*40,48,1.4,i<G.hearts);
  if(G.combo>=3){ctx.textAlign='center'; ctx.font='800 22px '+FONT; ctx.fillStyle='#a0663a'; ctx.fillText('連吃 ×'+G.combo,W/2,48);}
}

// ---------- loop & input ----------
let last=performance.now(),acc=0,paused=false;
function loop(now){
  let dt=now-last; last=now; if(dt>100) dt=100;
  if(G&&!paused){acc+=dt; while(acc>=1000/60){step(); acc-=1000/60;}}
  draw(); requestAnimationFrame(loop);
}
function toGame(clientX){const r=cv.getBoundingClientRect(); return (clientX-r.left)/r.width*W;}
cv.addEventListener('pointerdown',e=>{if(G) G.tx=toGame(e.clientX);});
window.addEventListener('pointermove',e=>{if(G&&(e.pointerType==='mouse'||e.buttons||e.pressure>0)) G.tx=toGame(e.clientX);});
const keys={};
window.addEventListener('keydown',e=>{keys[e.key]=true;});
window.addEventListener('keyup',e=>{keys[e.key]=false;});
setInterval(()=>{if(!G||G.state!=='play')return; if(keys.ArrowLeft) G.tx=G.px-40; if(keys.ArrowRight) G.tx=G.px+40;},16);
document.addEventListener('visibilitychange',()=>{paused=document.hidden;});

function start(){sfx.init(); window.tmgTrack&&tmgTrack('game_start',{game_name:'薯懶接洋芋片'}); document.getElementById('start').classList.add('hidden'); document.getElementById('over').classList.add('hidden'); newGame();}
function gameOver(){
  G.state='over'; sfx.over();
  const s=G.score, nb=s>best; window.tmgTrack&&tmgTrack('game_end',{game_name:'薯懶接洋芋片',score:s,play_seconds:Math.round(G.t/60),result:nb&&s>0?'new_record':'game_over'}); if(nb){best=s; try{localStorage.setItem('shulan-best',best);}catch(e){}}
  document.getElementById('final').textContent=s;
  document.getElementById('overImg').src=s>=30?SPR.smug:SPR.crash;
  document.getElementById('overTitle').textContent=nb&&s>0?'新紀錄！':'吃到蔬菜了…';
  document.getElementById('overMsg').textContent=s>=60?'薯懶：這才叫專業的沙發馬鈴薯。':s>=30?'薯懶：嗯…還可以再吃。':s>=10?'薯懶：才這樣？我還沒吃飽欸。':'薯懶：你是不是偷偷想讓我吃蔬菜？';
  document.getElementById('best').textContent='最高紀錄：'+best+' 片';
  document.getElementById('over').classList.remove('hidden');
}
document.getElementById('bStart').onclick=start;
document.getElementById('bAgain').onclick=start;
window.__g=()=>G;
requestAnimationFrame(loop);
})();
</script>

<style>
:root{--bg:#0f1115;--panel:#181b22;--text:#e8eaf0;--muted:#8a90a0;--blue:#3d8bfd;--red:#ff5a4f;--line:#2a2f3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang TC","Noto Sans CJK TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.score{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border-radius:12px;padding:10px 16px;margin-bottom:10px}
.side{display:flex;align-items:center;gap:10px}
.team{font-weight:700;font-size:15px}
.team.b{color:var(--blue)}.team.r{color:var(--red)}
.num{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.mid{text-align:center;color:var(--muted);font-size:12px;line-height:1.4}
.mid b{display:block;color:var(--text);font-size:16px;font-variant-numeric:tabular-nums}
#stage{position:relative;width:100%;aspect-ratio:1/1;background:#0a0c10;border-radius:14px;overflow:hidden}
#c{width:100%;height:100%;display:block}
.btns{display:flex;gap:8px;margin:12px 0}
button{flex:1;padding:12px 6px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:15px;font-weight:600;font-family:inherit}
button:active{transform:scale(.97)}
details{background:var(--panel);border-radius:12px;padding:10px 14px}
summary{font-weight:700;cursor:pointer;padding:4px 0}
.cfg{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
.cfg h3{margin:0 0 4px;font-size:14px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 2px}
.val{float:right;color:var(--text);font-variant-numeric:tabular-nums}
input[type=range]{width:100%}
.hint{color:var(--muted);font-size:12px;margin-top:10px;line-height:1.6}
.note{color:var(--muted);font-size:12px;line-height:1.7;margin-top:14px}
#rc{display:none}
body.rec .wrap{display:none}
body.rec #rc{display:block;width:100%;max-width:calc(100vh*9/16);margin:0 auto}

  <h1>🤖 機器人相撲模擬賽</h1>
  <div class="sub">兩台 AI 機器人互推，先被推出擂台的就輸了</div>

  <div class="score">
    <div class="side"><span class="team b">藍方</span><span class="num" id="sb">0</span></div>
    <div class="mid">第 <span id="rd">1</span> 回合<b id="tm">30.0</b></div>
    <div class="side"><span class="num" id="sr">0</span><span class="team r">紅方</span></div>
  </div>

  <div id="stage"><canvas id="c"></canvas></div>

  <div class="btns">
    <button id="bSnd" onclick="this.textContent=(sfx.toggle(),tmgMusic.sync(),sfx.on)?'🔊 聲音開':'🔇 聲音關'">🔊 聲音開</button>
    <button id="bPause">暫停</button>
    <button id="bRand">隨機屬性</button>
    <button id="bReset">重新開始</button>
  </div>

  <details>
    <summary>⚙️ 調整機器人屬性</summary>
    <div class="cfg" id="cfg"></div>
    <div class="hint">調整會在下一回合生效。重量越重抓地力越好、越難被推，但加速比較慢；馬力太大而車太輕會打滑。正面用鏟子撞到對手側面或背面，能把對手鏟起來，讓它短暫失去抓地力。</div>
  </details>

  <div class="note">
    物理引擎是自己寫的（不需連網）：機器人有質量、抓地力、側向摩擦和碰撞反彈。AI 會追著對手衝撞、偶爾繞側面，靠近邊緣時會想辦法退回中間。30 秒內都沒人出界，就判離中心比較近的一方獲勝。
  </div>

const sfx=(()=>{let ac=null,on=true;try{on=localStorage.getItem('tmg-sound')!=='off';}catch(e){}
 function init(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(ac&&ac.state==='suspended')ac.resume();}
 function tone(f,d,type,vol,f2,delay){if(!on||!ac)return;const t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(vol||0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+0.02);}
 function noise(d,freq,vol,delay){if(!on||!ac)return;const t=ac.currentTime+(delay||0),n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),c=b.getChannelData(0);
  for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=b;f.type='bandpass';f.frequency.value=freq;f.Q.value=1.2;g.gain.value=vol||0.4;s.connect(f).connect(g).connect(ac.destination);s.start(t);}
 return {init,get on(){return on;},toggle(){on=!on;try{localStorage.setItem('tmg-sound',on?'on':'off');}catch(e){}init();return on;},
  crunch(){noise(0.07,2600,0.5);noise(0.06,1800,0.35,0.07);},
  bonus(){[660,880,1320].forEach((f,i)=>tone(f,0.12,'triangle',0.18,0,i*0.07));},
  bad(){tone(220,0.28,'square',0.12,90);},
  combo(){[523,659,784,1047].forEach((f,i)=>tone(f,0.13,'triangle',0.16,0,i*0.08));},
  over(){[523,440,349,262].forEach((f,i)=>tone(f,0.22,'triangle',0.16,0,i*0.16));},
  hit(p){const v=Math.min(0.5,0.12+p*0.08);tone(140,0.18,'sine',v,55);noise(0.08,900,v);},
  go(){tone(880,0.18,'square',0.1);},
  beep(){tone(520,0.1,'square',0.08);},
  win(){[523,659,784].forEach((f,i)=>tone(f,0.16,'triangle',0.16,0,i*0.1));tone(1047,0.35,'triangle',0.16,0,0.3);}};})();

(function(){

const REC=location.hash==='#record';

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=window.__seed?mulberry32(window.__seed):Math.random;

const cfg=REC?{blue:{power:6,turn:3,weight:10},red:{power:10,turn:9,weight:2}}
             :{blue:{power:6,turn:5,weight:5},red:{power:5,turn:6,weight:6}};
const COLORS={blue:'#3d8bfd',red:'#ff5a4f'};
const NAMES=REC?{blue:'坦克',red:'跑車'}:{blue:'藍方',red:'紅方'};

let robots=[], sparks=[], score={blue:0,red:0}, round=1, roundTime=0, roundsDone=0;
let state='ready', timer=0, paused=false, shake=0, banner={text:'',color:'#fff',t:0};
const $=id=>document.getElementById(id);

function showBanner(text,color,ticks){banner={text,color:color||'#fff',t:ticks||66};}

function makeRobot(team,x,angle){
  const c=cfg[team];
  return {team,x,y:(rnd()-.5)*40,vx:0,vy:0,angle:angle+(rnd()-.5)*0.3,av:0,
    mass:4+c.weight*0.8,lift:0,out:false,touching:false,thrust:0,turnCmd:0,

}

function reset(){
  robots=[makeRobot('blue',-180,0),makeRobot('red',180,Math.PI)];
  sparks=[]; roundTime=0; state='ready'; timer=70;
  if(!REC) $('rd').textContent=round;
  showBanner('第 '+round+' 回合','#fff',60);
}

function ai(me,op){

  // being shoved backwards, or cornered at the edge with the opponent in the way: swerve aside
  const vf=me.vx*Math.cos(me.angle)+me.vy*Math.sin(me.angle);
  me.pushed=(me.touching&&vf<-0.05)?me.pushed+1:Math.max(0,me.pushed-2);
  if(me.dodgeT>0) me.dodgeT--;
  else if(me.pushed>25||(w>0.45&&ox*cx+oy*cy>0.6&&dOp<140)){
    me.dodge=(rnd()<.5?-1:1)*(1.2+rnd()*0.4); me.dodgeT=35+rnd()*20; me.pushed=0;}
  if(me.dodgeT>0){const a=Math.atan2(oy,ox)+me.dodge; tx=Math.cos(a); ty=Math.sin(a);}
  else{
    const ang=Math.atan2(oy,ox)+me.flank*Math.min(1,Math.max(0,(dOp-80)/250));
    tx=Math.cos(ang); ty=Math.sin(ang);
    tx=tx*(1-w)+cx*w*1.6; ty=ty*(1-w)+cy*w*1.6;
  }
  let diff=Math.atan2(ty,tx)-me.angle; diff=Math.atan2(Math.sin(diff),Math.cos(diff));
  const maxTurn=0.03+c.turn*0.011;
  me.turnCmd=Math.max(-maxTurn,Math.min(maxTurn,diff*0.25));
  const facing=Math.cos(diff);
  let f=(1.0+c.power*0.3)*(0.4+0.6*Math.max(0,facing));
  f=Math.min(f*me.cond,0.42*me.mass*me.cond);           // traction limit: light robots spin their wheels
  if(facing<-0.2) f*=-0.4;
  me.thrust=f;
}

function integrate(r){
  const lifted=r.lift>0, grip=lifted?0.3:1; if(lifted) r.lift--;
  r.av+=(r.turnCmd*grip-r.av)*0.25; r.angle+=r.av;
  const fx=Math.cos(r.angle), fy=Math.sin(r.angle);
  const a=r.thrust*grip/r.mass; r.vx+=fx*a; r.vy+=fy*a;
  const vf=r.vx*fx+r.vy*fy, vl=-r.vx*fy+r.vy*fx;
  const nvf=vf*(1-(lifted?0.02:0.045)), nvl=vl*(1-(lifted?0.03:0.14));
  r.vx=fx*nvf-fy*nvl; r.vy=fy*nvf+fx*nvl;
  r.x+=r.vx; r.y+=r.vy;
}

function spark(x,y,n,sp0){
  for(let i=0;i<n;i++){const a=rnd()*Math.PI*2, sp=1+rnd()*3+sp0;
    sparks.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:18+rnd()*16});}
}

function collide(A,B){
  const ax=A.x+Math.cos(A.angle)*COFF, ay=A.y+Math.sin(A.angle)*COFF;
  const bx=B.x+Math.cos(B.angle)*COFF, by=B.y+Math.sin(B.angle)*COFF;
  const dx=bx-ax, dy=by-ay, d=Math.hypot(dx,dy), min=RAD*2;
  if(d>=min||d===0){A.touching=B.touching=false; return;}
  const nx=dx/d, ny=dy/d, pen=min-d, im=1/A.mass+1/B.mass;
  A.x-=nx*pen/A.mass/im; A.y-=ny*pen/A.mass/im;
  B.x+=nx*pen/B.mass/im; B.y+=ny*pen/B.mass/im;
  const rv=(B.vx-A.vx)*nx+(B.vy-A.vy)*ny;
  if(rv<0){const j=-1.25*rv/im;
    A.vx-=nx*j/A.mass; A.vy-=ny*j/A.mass; B.vx+=nx*j/B.mass; B.vy+=ny*j/B.mass;}
  const aF=Math.cos(A.angle)*nx+Math.sin(A.angle)*ny, bF=-(Math.cos(B.angle)*nx+Math.sin(B.angle)*ny);
  if(aF>0.8&&bF<0.6&&rv<-0.5) B.lift=Math.max(B.lift,25);
  if(bF>0.8&&aF<0.6&&rv<-0.5) A.lift=Math.max(A.lift,25);
  const tv=(B.vx-A.vx)*(-ny)+(B.vy-A.vy)*nx; A.av+=tv*0.004; B.av+=tv*0.004;
  const cx=ax+nx*RAD, cy=ay+ny*RAD;
  if(!A.touching&&-rv>0.6){if(!REC)sfx.hit(-rv); spark(cx,cy,Math.min(26,Math.round(4-rv*4)),-rv); shake=Math.min(14,shake-rv*2);}
  else if(rnd()<0.15) spark(cx,cy,1,0.5);
  A.touching=B.touching=true;
}

function endRound(msg,color){
  state='end'; timer=110; roundsDone++; if(!REC){sfx.win(); window.tmgTrack&&tmgTrack('game_end',{game_name:'機器人相撲',round:round,score:score.blue+':'+score.red,play_seconds:Math.round(roundTime),result:msg});} showBanner(msg,color,100);
  if(!REC){$('sb').textContent=score.blue; $('sr').textContent=score.red;}
}

function step(){
  if(state==='ready'){ if(--timer<=0){state='fight'; showBanner('開始！','#fff',36); if(!REC){sfx.go(); window.tmgTrack&&tmgTrack('game_start',{game_name:'機器人相撲',round:round});}} }
  else if(state==='fight'){
    ai(robots[0],robots[1]); ai(robots[1],robots[0]);
    roundTime+=1/60;
  } else if(state==='end'){ if(--timer<=0){round++; reset(); return;} }
  robots.forEach(r=>{if(state!=='fight'||r.out){r.thrust=0;r.turnCmd=0;}});
  robots.forEach(integrate);
  collide(robots[0],robots[1]);
  if(state==='fight'){
    robots.forEach(r=>{if(Math.hypot(r.x,r.y)>R+8) r.out=true;});
    const outs=robots.filter(r=>r.out);
    if(outs.length===2) endRound('同時出界，平手！','#fff');
    else if(outs.length===1){const win=outs[0].team==='blue'?'red':'blue'; score[win]++; endRound(NAMES[win]+'獲勝！',COLORS[win]);}
    else if(roundTime>=ROUND_SEC){
      const win=Math.hypot(robots[0].x,robots[0].y)<Math.hypot(robots[1].x,robots[1].y)?'blue':'red';
      score[win]++; endRound('時間到！'+NAMES[win]+'判定勝',COLORS[win]);
    }
  }
  for(const s of sparks){s.x+=s.vx; s.y+=s.vy; s.vx*=0.9; s.vy*=0.9; s.life--;}
  sparks=sparks.filter(s=>s.life>0);
  shake*=0.88; if(banner.t>0) banner.t--;
}

function drawRobot(x,r){
  const L=r.lift>0, k=L?1.08:1;
  x.save(); x.globalAlpha=r.out?0.45:1;
  x.save(); x.translate(r.x+(L?10:4),r.y+(L?14:6)); x.rotate(r.angle);
  x.fillStyle='rgba(0,0,0,.35)'; x.fillRect(-28,-26,74,52); x.restore();
  x.translate(r.x,r.y); x.rotate(r.angle); x.scale(k,k);
  x.fillStyle='#07080b'; x.fillRect(-21,-31,28,9); x.fillRect(-21,22,28,9);
  x.fillStyle=r.color; x.fillRect(-26,-23,52,46);
  x.lineWidth=2; x.strokeStyle='rgba(0,0,0,.4)'; x.strokeRect(-26,-23,52,46);
  x.beginPath(); x.moveTo(26,-27); x.lineTo(40,-21); x.lineTo(47,0); x.lineTo(40,21); x.lineTo(26,27); x.closePath();
  x.fillStyle='#c9ced8'; x.fill(); x.stroke();
  x.fillStyle='rgba(255,255,255,.18)'; x.fillRect(-20,-14,18,28);
  x.fillStyle='#fff'; x.beginPath(); x.arc(10,0,7,0,Math.PI*2); x.fill();
  x.fillStyle='#111'; x.beginPath(); x.arc(12.5,0,3.5,0,Math.PI*2); x.fill();
  x.restore();
}

function drawScene(x){
  x.beginPath(); x.arc(0,0,R+14,0,Math.PI*2); x.fillStyle='#e9e4d8'; x.fill();
  x.beginPath(); x.arc(0,0,R,0,Math.PI*2); x.fillStyle='#1d2129'; x.fill();
  const g=x.createRadialGradient(0,0,R*0.68,0,0,R);
  g.addColorStop(0,'rgba(255,80,60,0)'); g.addColorStop(1,'rgba(255,80,60,.2)');
  x.fillStyle=g; x.beginPath(); x.arc(0,0,R,0,Math.PI*2); x.fill();
  x.fillStyle='#363c48'; x.fillRect(-124,-42,8,84); x.fillRect(116,-42,8,84);
  robots.forEach(r=>drawRobot(x,r));
  for(const p of sparks){x.globalAlpha=Math.min(1,p.life/14);
    x.fillStyle=p.life>22?'#fff6c9':'#ffb340'; x.fillRect(p.x-2.5,p.y-2.5,5,5);}
  x.globalAlpha=1;
  if(banner.t>0){
    x.globalAlpha=Math.min(1,banner.t/12);
    x.font='800 60px '+FONT; x.textAlign='center'; x.textBaseline='middle';
    x.lineWidth=10; x.strokeStyle='rgba(0,0,0,.75)'; x.strokeText(banner.text,0,0);
    x.fillStyle=banner.color; x.fillText(banner.text,0,0); x.globalAlpha=1;
  }
}

// normal view
const cv=$('c'), ctx=cv.getContext('2d'); let dpr=1, scale=1;
function resize(){const r=cv.getBoundingClientRect(); dpr=window.devicePixelRatio||1;
  cv.width=Math.max(1,Math.round(r.width*dpr)); cv.height=Math.max(1,Math.round(r.height*dpr)); scale=r.width/W;}
window.addEventListener('resize',resize); resize();
function draw(){
  const w=cv.width,h=cv.height,s=scale*dpr;
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,w,h);
  ctx.setTransform(s,0,0,s,w/2+(rnd()-.5)*shake*dpr,h/2+(rnd()-.5)*shake*dpr);
  drawScene(ctx);
  $('tm').textContent=(state==='end'?0:Math.max(0,ROUND_SEC-roundTime)).toFixed(1);
}

// vertical 9:16 recording view
const rc=$('rc'), rx=rc.getContext('2d');
function txt(t,x,y,size,color,weight){rx.font=(weight||800)+' '+size+'px '+FONT; rx.fillStyle=color; rx.fillText(t,x,y);}
function drawRec(){
  rx.setTransform(1,0,0,1,0,0);
  const g=rx.createLinearGradient(0,0,0,1920); g.addColorStop(0,'#141824'); g.addColorStop(1,'#1c1230');
  rx.fillStyle=g; rx.fillRect(0,0,1080,1920);
  rx.textAlign='center'; rx.textBaseline='alphabetic';
  txt('我不會寫程式',540,190,76,'#fff');
  txt('叫 AI 做了機器人相撲 🤖',540,295,70,'#ffd84d');
  txt(NAMES.blue,250,430,62,COLORS.blue); txt('重量 10',250,490,40,'#9aa1b2',600);
  txt('VS',540,455,56,'#fff');
  txt(NAMES.red,830,430,62,COLORS.red); txt('馬力 10',830,490,40,'#9aa1b2',600);
  txt(String(score.blue),250,610,96,'#fff'); txt(String(score.red),830,610,96,'#fff');
  txt('第 '+round+' 回合',540,565,38,'#9aa1b2',600);
  txt((state==='end'?0:Math.max(0,ROUND_SEC-roundTime)).toFixed(1),540,615,44,'#fff',700);
  const s=1.4; rx.setTransform(s,0,0,s,540+(rnd()-.5)*shake*s,1150+(rnd()-.5)*shake*s);
  drawScene(rx);
  rx.setTransform(1,0,0,1,0,0); rx.textAlign='center';
  txt('你覺得誰會贏？👇',540,1760,64,'#fff');
  txt('留言告訴我下一集用 AI 做什麼遊戲',540,1840,40,'#9aa1b2',600);
}

const render=REC?drawRec:draw;
window.__rec={frame(n){for(let i=0;i<(n||2);i++) step(); render(); return {roundsDone,state,timer,score};},
  url(){return rc.toDataURL('image/jpeg',0.92);},
  sim(n){for(let i=0;i<n;i++) step(); return {roundsDone,state,score,round};},
  cfg,
  dbg(){return robots.map(r=>({x:r.x|0,y:r.y|0,a:+r.angle.toFixed(2),v:+Math.hypot(r.vx,r.vy).toFixed(2),th:+r.thrust.toFixed(2),lift:r.lift}));}};

let last=performance.now(), acc=0;
function frame(now){
  let dt=now-last; last=now; if(dt>100) dt=100;
  if(!paused){acc+=dt; while(acc>=STEP){step(); acc-=STEP;}}
  render(); requestAnimationFrame(frame);
}

// controls
const LABELS={power:'馬力',turn:'轉向速度',weight:'重量'};
const cfgEl=$('cfg');
['blue','red'].forEach(team=>{
  const col=document.createElement('div');
  col.innerHTML='<h3 style="color:'+COLORS[team]+'">'+NAMES[team]+'</h3>';
  Object.keys(LABELS).forEach(k=>{const id=team+'-'+k;
    col.insertAdjacentHTML('beforeend','<label for="'+id+'">'+LABELS[k]+'<span class="val" id="'+id+'-v">'+cfg[team][k]+'</span></label><input type="range" min="1" max="10" step="1" id="'+id+'" value="'+cfg[team][k]+'">');});
  cfgEl.appendChild(col);
});
cfgEl.addEventListener('input',e=>{const [team,k]=e.target.id.split('-'); cfg[team][k]=+e.target.value; $(e.target.id+'-v').textContent=e.target.value;});
function syncSliders(){['blue','red'].forEach(t=>Object.keys(LABELS).forEach(k=>{$(t+'-'+k).value=cfg[t][k]; $(t+'-'+k+'-v').textContent=cfg[t][k];}));}
$('bPause').onclick=e=>{paused=!paused; e.target.textContent=paused?'繼續':'暫停';};
$('bReset').onclick=()=>{score={blue:0,red:0}; round=1; $('sb').textContent=0; $('sr').textContent=0; reset();};
$('bRand').onclick=()=>{['blue','red'].forEach(t=>Object.keys(LABELS).forEach(k=>cfg[t][k]=1+Math.floor(Math.random()*10))); syncSliders(); showBanner('屬性已隨機，下回合生效','#fff',80);};

reset();
if(!window.__manual) requestAnimationFrame(frame);
})();
</script>
